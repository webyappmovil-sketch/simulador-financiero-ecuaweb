    });
    document.querySelectorAll('[data-student-toggle]').forEach(b=>b.onclick=async()=>{
      const userId=b.dataset.studentToggle,user=state.adminData.registry.find(u=>u.id===userId);if(!user||user.role!=='user')return;
      const status=b.dataset.currentStatus==='active'?'blocked':'active';if(!confirm(`¿Deseas ${status==='blocked'?'bloquear':'habilitar'} a ${user.email}?`))return;
      try{await DB.setAccount(user.email,{accessStatus:status,...(status==='active'?{accessSource:'manual'}:{})});refresh();}catch(e){alert('No se pudo cambiar el acceso: '+e.message);}
    });
    document.querySelectorAll('[data-user-delete]').forEach(b=>b.onclick=async()=>{
      const userId=b.dataset.userDelete,email=b.dataset.userEmail,user=state.adminData.registry.find(u=>u.id===userId);
      if(!user||user.role!=='user'||email===state.user){alert('Solo puedes eliminar cuentas de estudiantes desde esta lista.');return;}
      if(prompt(`Se borrará la cuenta de ${email} y sus datos del simulador. Esta acción no se puede deshacer. Escribe ELIMINAR para confirmar.`)!=='ELIMINAR')return;
      try{await DB.permanentlyDeleteAccount(userId);alert('Cuenta eliminada. La plaza ya no se cuenta como inscrita.');refresh();}catch(e){alert('No se pudo eliminar la cuenta: '+(e.message||'Error desconocido.'));}
    });
    return;
  }
  if (state.page==='admin-legacy'){
    const enableNotices=document.getElementById('btnEnableRegistrationNotifications');
    if(enableNotices) enableNotices.onclick=async()=>{
      if(!window.Notification){alert('Este navegador no admite notificaciones. Los registros seguirán apareciendo en el panel.');return;}
      const permission=await Notification.requestPermission();
      const status=document.getElementById('registrationNotificationStatus');
      if(status)status.textContent='Permiso: '+permission;
      if(permission==='granted')alert('Notificaciones activadas. Recibirás avisos mientras el panel de administrador permanezca abierto.');
      else alert('El navegador no concedió permiso. Puedes permitir las notificaciones desde la configuración del sitio.');
    };
    const clearAdminProject=document.getElementById('btnClearAdminProject');
    if(clearAdminProject) clearAdminProject.onclick=async()=>{
      if(state.user!==ADMIN_EMAIL||!state.isAdmin){alert('Esta acción solo está disponible para la cuenta administradora autorizada.');return;}
      const phrase=prompt('Se borrarán las variables y los ítems de prueba del proyecto administrador. La cuenta y su contraseña se conservarán.\n\nPara continuar, escribe: LIMPIAR');
      if(phrase===null||phrase.trim()!=='LIMPIAR'){if(phrase!==null)alert('La confirmación no coincide. No se modificaron los datos.');return;}
      const blank=blankProjectVars(), saved=await DB.setScenario(state.user,blank);
      if(!saved){alert('No se pudo guardar el proyecto en blanco. Intenta nuevamente.');return;}
      state.vars=blank; state.page='variables'; state.openAccordion=0; state.doneAccordions={}; state.authMsg=null;
      alert('Los datos del proyecto administrador quedaron en blanco. La cuenta y los usuarios se conservaron.');
      render();
    };
    document.querySelectorAll('[data-access-toggle]').forEach(b=>{
      b.onclick = async ()=>{
        const email = b.dataset.accessToggle;
        const acc = state.adminData.accounts[email] || {};
        const current=acc.accessStatus||'pending';
        const next=current==='active'?'blocked':'active';
        const action=next==='active'?'habilitar el acceso':'bloquear el acceso';
        if(!confirm('¿Deseas '+action+' para '+email+'?'))return;
        try{
          await DB.setAccount(email,{accessStatus:next,...(next==='active'?{accessSource:'manual'}:{})});
          state.adminData.accounts[email]={...acc,accessStatus:next,blocked:next==='blocked',accessSource:next==='active'?'manual':acc.accessSource};
          state.adminData.registry=state.adminData.registry.map(u=>u.email===email?{...u,accessStatus:next,accessSource:next==='active'?'manual':u.accessSource}:u);
          render();
        }catch(e){alert('No se pudo actualizar el acceso: '+e.message);}
      };
    });
    document.querySelectorAll('[data-payment-reviewed]').forEach(b=>{
      b.onclick=async()=>{
        const email=b.dataset.paymentReviewed;
        if(!confirm('¿Confirmaste el pago de '+email+'? Esto marcará el pago como verificado y mantendrá su acceso.'))return;
        try{
          await DB.setAccount(email,{accessStatus:'active',accessSource:'manual'});
          state.adminData.accounts[email]={...(state.adminData.accounts[email]||{}),accessStatus:'active',accessSource:'manual',blocked:false};
          state.adminData.registry=state.adminData.registry.map(u=>u.email===email?{...u,accessStatus:'active',accessSource:'manual'}:u);
          render();
        }catch(e){alert('No se pudo actualizar la revisión: '+e.message);}
      };
    });
    document.querySelectorAll('[data-user-delete]').forEach(b=>{
      b.onclick=async()=>{
        const userId=b.dataset.userDelete, email=b.dataset.userEmail;
        if(!userId||!email||email===state.user||state.adminData.registry.find(u=>u.id===userId)?.role==='admin'){
          alert('No se puede eliminar esta cuenta desde aquí.'); return;
        }
        const phrase=prompt(`Esta acción eliminará permanentemente la cuenta de ${email} y sus datos guardados del simulador. No se puede deshacer.\n\nPara confirmar, escribe ELIMINAR`);
        if(phrase===null)return;
        if(phrase.trim()!=='ELIMINAR'){alert('La confirmación no coincide. No se eliminó la cuenta.');return;}
        try{
          b.disabled=true;
          await DB.permanentlyDeleteAccount(userId);
          state.adminData.registry=state.adminData.registry.filter(u=>u.id!==userId);
          delete state.adminData.accounts[email];
          render();
          alert(`Se eliminó la cuenta ${email}.`);
        }catch(e){b.disabled=false;alert('No se pudo eliminar la cuenta: '+(e.message||'Error desconocido.'));}
      };
    });
    return;
  }
  if (state.page==='changepass'){
    document.getElementById('btnChangePass').onclick = async ()=>{
      const cur=document.getElementById('cpCurrent').value, n1=document.getElementById('cpNew').value, n2=document.getElementById('cpConfirm').value;
      if (!cur||!n1||!n2){ state.authMsg={type:'err',text:'Completa los tres campos.'}; render(); return; }
      if (n1.length<8){ state.authMsg={type:'err',text:'La nueva contraseña debe tener al menos 8 caracteres.'}; render(); return; }
      if (n1!==n2){ state.authMsg={type:'err',text:'La confirmación no coincide con la nueva contraseña.'}; render(); return; }
      try{
        const check=await supabaseClient.auth.signInWithPassword({email:state.user,password:cur});
        if(check.error) throw new Error('Tu contraseña actual no es correcta.');
        const {error}=await supabaseClient.auth.updateUser({password:n1});
        if(error) throw error;
        state.authMsg={type:'ok',text:'Contraseña actualizada correctamente.'}; render();
      }catch(e){state.authMsg={type:'err',text:e.message||'No se pudo actualizar la contraseña.'};render();}
    };
    return;
  }
  if (state.page==='home'){
    drawHomeCharts(M);
    document.querySelectorAll('[data-varblock]').forEach(el=>{ el.onclick=(e)=>{ e.preventDefault(); state.openAccordion=Number(el.dataset.varblock); navigateTo('variables'); }; });
    document.querySelectorAll('[data-sheetlink]').forEach(el=>{ el.onclick=(e)=>{ e.preventDefault(); navigateTo(el.dataset.sheetlink); }; });
    document.querySelectorAll('[data-dashanio]').forEach(el=>{ el.onclick=()=>{ state.dashFilters.anio = Number(el.dataset.dashanio); render(); }; });
    document.querySelectorAll('[data-dashflujo]').forEach(el=>{ el.onclick=()=>{ state.dashFilters.flujo = el.dataset.dashflujo; render(); }; });
    document.getElementById('btnExportAllXlsx').onclick=()=>exportAllXlsx(M);
    document.getElementById('btnExportAllWord').onclick=()=>exportAllWord(M);
    document.getElementById('btnExportInforme').onclick=()=>exportInformeFinancieroWord(M);
    return;
  }
  if (state.page==='variables'){
    document.querySelectorAll('[data-acchead]').forEach(h=>{ h.onclick=()=>{ const i=Number(h.dataset.acchead); state.openAccordion = state.openAccordion===i? -1:i; render(); }; });
    document.querySelectorAll('[data-accdone]').forEach(b=>{ b.onclick=async ()=>{ const i=Number(b.dataset.accdone); state.doneAccordions[i]=true; state.openAccordion=-1; await persist(); render(); }; });
    const simpleMap = {
      'v-producto':'producto', 'v-valorResidual':'activos.valorResidualPct', 'v-aniosAmort':'diferidos.aniosAmortizacion',
      'v-numTrabajadores':'produccion.numTrabajadores', 'v-horasDiarias':'produccion.horasDiarias',
      'v-tiempoPrepMin':'produccion.tiempoPrepMin', 'v-diasMes':'produccion.diasMes',
      'v-pctUtilizacion':'produccion.pctUtilizacion', 'v-salarioMinimo':'personal.salarioMinimo', 'v-pctIessPersonal':'personal.pctIessPersonal', 'v-pctIess':'personal.pctIessPatronal',
      'v-pctFondoReserva':'personal.pctFondoReserva', 'v-areaAdmin':'areas.admin', 'v-areaVentas':'areas.ventas', 'v-areaPlanta':'areas.planta',
      'v-valorAlquiler':'areas.valorAlquilerMensual', 'v-pctPropio':'financiamiento.pctCapitalPropio', 'v-numSocios':'financiamiento.numSocios',
      'v-tasaInteres':'financiamiento.tasaInteres', 'v-plazoAnios':'financiamiento.plazoAnios', 'v-partEmpleados':'financiamiento.participacionEmpleados',
      'v-impRenta':'financiamiento.impuestoRenta', 'v-mesesCT':'financiamiento.mesesCapitalTrabajo', 'v-margen':'precioVenta.margen', 'v-margen2':'precioVenta.margen',
      'v-tasaCrecimiento':'crecimiento.tasaCrecimientoVentas', 'v-inflacion':'crecimiento.inflacionCostos', 'v-sensMenos5':'crecimiento.sensibilidadMenos5', 'v-sensMenos10':'crecimiento.sensibilidadMenos10', 'v-rf':'otrosFinancieros.rf',
      'v-mrp':'otrosFinancieros.mrp', 'v-beta':'otrosFinancieros.beta', 'v-riesgoPais':'otrosFinancieros.riesgoPais'
    };
    Object.keys(simpleMap).forEach(elId=>{
      const el = document.getElementById(elId); if (!el) return;
      el.onchange = async ()=>{ const val = el.type==='number' ? parseFloat(el.value)||0 : el.value; setPath(state.vars, simpleMap[elId], val); await persist(); render(); };
    });
    const sensPersonalizada=document.getElementById('v-sensPersonalizada');
    if(sensPersonalizada) sensPersonalizada.onchange=async()=>{ const raw=sensPersonalizada.value.trim(); setPath(state.vars,'crecimiento.sensibilidadPersonalizada',raw===''?null:Number(raw)); await persist(); render(); };
    document.querySelectorAll('[data-vidautil]').forEach(el=>{
      el.onchange = async ()=>{
        const k = el.dataset.vidautil;
        state.vars.activos.vidaUtil[k] = parseFloat(el.value)||1;
        await persist(); render();
      };
    });
    document.querySelectorAll('[data-item]').forEach(el=>{
      el.onchange = async ()=>{
        const path = el.dataset.item, idx = Number(el.dataset.idx), field = el.dataset.field;
        const val = el.tagName==='SELECT' ? el.value : (el.type==='number' ? parseFloat(el.value)||0 : el.value);
        {
          const row = getPath(state.vars, path)[idx];
          if (field==='fechaFinal' && row.fechaInicio && val && val < row.fechaInicio){
            alert('La Fecha Final no puede ser anterior a la Fecha de Inicio ('+row.fechaInicio+'). Corrige la fecha.');
            render(); return;
          }
          if (field==='fechaInicio' && row.fechaFinal && val && val > row.fechaFinal){
            alert('La Fecha de Inicio no puede ser posterior a la Fecha Final ('+row.fechaFinal+'). Se ajustó la Fecha Final para que coincida.');
            row.fechaFinal = val;
          }
          row[field] = val;
        }
        await persist();
        render();
      };
    });
    document.querySelectorAll('[data-additem]').forEach(b=>{
      b.onclick = async ()=>{
        const path = b.dataset.additem;
        {
          const arr = getPath(state.vars, path);
          const sample = arr.length? Object.keys(arr[0]) : ['nombre','cantidad','costo'];
          const blank = {}; sample.forEach(k=> blank[k] = (k==='depto'?'Administracion':(k==='funcion'?'Administracion':(k==='categoria'?'muebles':(k==='porcionTipo'?'unidad':(typeof arr[0]?.[k]==='number'?0:''))))));
          arr.push(blank);
        }
        await persist(); render();
      };
    });
    document.querySelectorAll('[data-rmitem]').forEach(b=>{
      b.onclick = async ()=>{
        const path=b.dataset.rmitem, idx=Number(b.dataset.idx);
        getPath(state.vars, path).splice(idx,1);
        await persist(); render();
      };
    });
    return;
  }
  drawSheetCharts(state.page, M);
  const xb = document.querySelector('[data-exportxlsx]'); if (xb) xb.onclick = ()=> exportSheetXlsx(state.page, M);
  const wb = document.querySelector('[data-exportword]'); if (wb) wb.onclick = ()=> exportSheetWord(state.page, M);
}

/* ---------- 16. ARRANQUE ---------- */
async function startApp(){
  if(!supabaseClient){state.authMsg={type:'err',text:'No se pudo cargar la conexión segura. Verifica que tengas internet y recarga la página.'};render();return;}
  try{
    if(SELLER_CODE||ADMIN_DIRECT_CODE)state.authMode='register';
    if(CENTER_CODE){try{state.enrollmentCenter=await DB.getCenterByCode(CENTER_CODE);}catch(e){state.enrollmentCenter=null;}}
    if(SELLER_CODE){try{state.sellerInvite=await DB.getSellerByCode(SELLER_CODE);}catch(e){state.sellerInvite=null;}}
    if(ADMIN_DIRECT_CODE){try{state.adminDirectInvite=await DB.resolveAdminDirectCode(ADMIN_DIRECT_CODE);}catch(e){state.adminDirectInvite=false;}}
    const authCallback=new URLSearchParams(window.location.hash.replace(/^#/,''));
    const emailConfirmed=authCallback.get('type')==='signup';
    const {data,error}=await supabaseClient.auth.getSession();
    if(error) throw error;
    if(emailConfirmed){
      if(data.session) await supabaseClient.auth.signOut();
      history.replaceState(null,'',window.location.pathname+window.location.search);
      state.user=null;state.vars=null;state.isAdmin=false;state.page='home';state.authMode='login';
      state.authMsg={type:'ok',text:'Correo confirmado correctamente. Ahora inicia sesión con tu correo y contraseña.'};
      render();return;
    }
    if(data.session){
      try{await finishSupabaseLogin(data.session.user);}
      catch(e){await supabaseClient.auth.signOut();state.user=null;state.vars=null;state.isAdmin=false;state.authMsg={type:'err',text:e.message||'No se pudo cargar tu cuenta. Intenta iniciar sesión otra vez.'};}
    }
  }catch(e){state.authMsg={type:'err',text:'No se pudo conectar con Supabase: '+(e.message||'revisa tu conexión y la configuración del proyecto.')};}
  render();
}
startApp();
</script>
