      {key:'porcionTipo',label:'Unidad de Porción',type:'select',options:['gramos','mililitros','kilos','litros','libras','unidad','otra unidad']},
      {key:'costoPorPorcion',label:'Costo x Porción',type:'computed',compute:(it)=>{ const factor=(it.porcionTipo==='gramos'||it.porcionTipo==='mililitros')?1000:1; return money((Number(it.costo)||0)*((Number(it.porcion)||0)/factor)); }},
      {key:'unidadesAProducir',label:'Unid. a Producir',type:'computed',compute:()=>fmt(M.produccion.produccionMensual,2)},
      {key:'total',label:'Costo Total',type:'computed',compute:(it)=>{ const factor=(it.porcionTipo==='gramos'||it.porcionTipo==='mililitros')?1000:1; const costoPorPorcion=(Number(it.costo)||0)*((Number(it.porcion)||0)/factor); return money(costoPorPorcion*M.produccion.produccionMensual); }}
    ], 'materiaPrima.items')}
    <div class="grid grid-2" style="margin:10px 0 4px;">
      ${calcBox('Total de Materia Prima', money(M.materiaPrima.total), 'Suma de Cantidad × Costo Unitario de todos los ítems')}
      ${calcBox('Costo Unitario de Materia Prima', money(M.materiaPrima.costoUnitario), 'Total de Materia Prima ÷ Unidades a Producir Mensualmente')}
    </div>
    <h4 style="font-size:13px;margin:16px 0 6px;">Materiales Indirectos</h4>${itemsTable(V.materialesIndirectos.items, [{key:'nombre',label:'Ítem',type:'text'},{key:'detalle',label:'Detalle',type:'text'},{key:'cantidad',label:'Cantidad',type:'number'},{key:'costo',label:'Costo Unit.',type:'number'},{key:'total',label:'Costo Total',type:'computed',compute:(it)=>money((Number(it.cantidad)||0)*(Number(it.costo)||0))}], 'materialesIndirectos.items')}
    <div class="grid grid-2" style="margin:10px 0 4px;">
      ${calcBox('Total de Materiales Indirectos', money(M.materialesIndirectos.total), 'Suma de Cantidad × Costo Unitario de todos los ítems')}
      ${calcBox('Costo Unitario de Materiales Indirectos', money(M.materialesIndirectos.total/(M.produccion.produccionMensual||1)), 'Total ÷ Unidades a Producir Mensualmente')}
    </div>
    <div class="info-hint" style="margin-top:8px;">Este Total y Costo Unitario también se muestran en el bloque "Distribución de Áreas (m²) y Costos Indirectos Fijos", junto al resto de los Costos Indirectos de Fabricación (CIF).</div>`;

  const bSum = `<div class="info-hint">Inventario de suministros de consumo del negocio, separado por tipo. No afecta el costeo de producción — es de referencia y control interno.</div>
    <h4 style="font-size:13px;margin:0 0 6px;">Inventario de Suministros de Oficina</h4>${itemsTable(V.suministrosOficina.items, [{key:'nombre',label:'Ítem',type:'text'},{key:'cantidad',label:'Cantidad',type:'number'},{key:'costo',label:'Costo Unit.',type:'number'}], 'suministrosOficina.items')}
    ${calcBox('Total Suministros de Oficina', money(M.suministrosOficina.total))}
    <h4 style="font-size:13px;margin:16px 0 6px;">Inventario de Suministros de Limpieza</h4>${itemsTable(V.suministrosLimpieza.items, [{key:'nombre',label:'Ítem',type:'text'},{key:'cantidad',label:'Cantidad',type:'number'},{key:'costo',label:'Costo Unit.',type:'number'}], 'suministrosLimpieza.items')}
    ${calcBox('Total Suministros de Limpieza', money(M.suministrosLimpieza.total))}`;


  const b4 = `<div class="field-row">
      <div class="field"><label>Salario mínimo vital</label><input id="v-salarioMinimo" type="number" step="any" value="${V.personal.salarioMinimo}"></div>
      <div class="field"><label>% Aporte Personal a Seguridad Social (IESS Personal)</label><input id="v-pctIessPersonal" type="number" step="any" value="${V.personal.pctIessPersonal}"><span class="u">Ecuador IESS ≈ 9.45%. Ajusta según tu país (España, etc.)</span></div>
    </div>
    <div class="field-row">
      <div class="field"><label>% IESS Patronal (aporte del empleador)</label><input id="v-pctIess" type="number" step="any" value="${V.personal.pctIessPatronal}"></div>
      <div class="field"><label>% Fondo de Reserva</label><input id="v-pctFondoReserva" type="number" step="any" value="${V.personal.pctFondoReserva}"></div>
    </div>
    <h4 style="font-size:13px;margin:14px 0 6px;">Personal de la empresa</h4>
    ${itemsTable(V.personal.empleados, [{key:'cargo',label:'Cargo',type:'text'},{key:'puestos',label:'N° Puestos',type:'number'},{key:'funcion',label:'Función',type:'select',options:['Administracion','Ventas','MOI','MOD']},{key:'remuneracion',label:'Remuneración',type:'number'}], 'personal.empleados')}
    <div class="empty-hint">Se calculan: IESS personal (descuento), valor neto a recibir, décimo tercero, décimo cuarto, vacaciones, fondo de reserva e IESS patronal — todo desglosado en las pestañas "Rol de Pagos General" y "Rol de Provisiones".</div>
    <div class="grid grid-2">
      ${calcBox('Total Nómina Mensual (costo empresa)', money(M.personal.totalMensual), 'Remuneración + provisiones + IESS patronal, todos los empleados')}
      ${calcBox('Total Neto a Recibir (empleados)', money(M.personal.empleados.reduce((s,e)=>s+e.netoTotal,0)), 'Remuneración − IESS personal, todos los empleados')}
    </div>`;

  const b5 = `<div class="field-row">
      <div class="field"><label>Área Administrativa (m²)</label><input id="v-areaAdmin" type="number" step="any" value="${V.areas.admin}"></div>
      <div class="field"><label>Área de Ventas (m²)</label><input id="v-areaVentas" type="number" step="any" value="${V.areas.ventas}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Área de Planta (m²)</label><input id="v-areaPlanta" type="number" step="any" value="${V.areas.planta}"></div>
      <div class="field"><label>Valor total de alquiler mensual</label><input id="v-valorAlquiler" type="number" step="any" value="${V.areas.valorAlquilerMensual}"></div>
    </div>
    <h4 style="font-size:13px;margin:14px 0 6px;">Otros costos indirectos de fabricación (mensual)</h4>${itemsTable(V.cifItems, [{key:'nombre',label:'Concepto',type:'text'},{key:'costo',label:'Costo Mensual',type:'number'}], 'cifItems')}
    <div class="empty-hint">El alquiler y estos costos se distribuyen automáticamente entre Planta, Administración y Ventas según los m² de cada área.</div>
    <div class="grid grid-3" style="margin-bottom:6px;">
      ${calcBox('Total CIF de Producción (Admin + Ventas + Planta)', money(M.cif.totalCompleto), 'Incluye Materiales Indirectos, Mano de Obra Indirecta y Depreciación')}
      ${calcBox('Total Materiales Indirectos', money(M.materialesIndirectos.total), 'Del bloque "Materia Prima y Materiales Indirectos"')}
      ${calcBox('Costo Unitario de Materiales Indirectos', money(M.materialesIndirectos.total/(M.produccion.produccionMensual||1)), 'Total ÷ Unidades a Producir Mensualmente')}
    </div>`;

  const F = V.financiamiento;
  const b6 = `<div class="field-row">
      <div class="field"><label>% Capital Propio</label><input id="v-pctPropio" type="number" step="any" value="${F.pctCapitalPropio}"></div>
      <div class="field"><label>Número de socios</label><input id="v-numSocios" type="number" step="any" value="${F.numSocios}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Tasa de interés anual del préstamo</label><input id="v-tasaInteres" type="number" step="any" value="${F.tasaInteres}"></div>
      <div class="field"><label>Plazo del préstamo (años)</label><input id="v-plazoAnios" type="number" step="any" value="${F.plazoAnios}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>% Participación de empleados sobre utilidades</label><input id="v-partEmpleados" type="number" step="any" value="${F.participacionEmpleados}"></div>
      <div class="field"><label>% Impuesto a la renta</label><input id="v-impRenta" type="number" step="any" value="${F.impuestoRenta}"></div>
    </div>
    <div class="field-row"><div class="field"><label>Meses de Capital de Trabajo a financiar</label><input id="v-mesesCT" type="number" step="any" value="${F.mesesCapitalTrabajo}"></div></div>
    <div class="grid grid-3">
      ${calcBox('Inversión Total', money(M.inversion.total), 'Activos fijos + diferidos + capital de trabajo')}
      ${calcBox('Aporte de Socios', money(M.inversion.aporteSocios), '% Capital Propio × Inversión Total')}
      ${calcBox('Monto del Préstamo', money(M.inversion.montoPrestamo), '% Capital Ajeno × Inversión Total')}
    </div>`;

  const PV = V.precioVenta;
  const b7 = `<h4 style="font-size:13px;margin:0 0 6px;">Precios de la competencia (referencia)</h4>${itemsTable(PV.competencia, [{key:'empresa',label:'Empresa',type:'text'},{key:'precio',label:'Precio',type:'number'}], 'precioVenta.competencia')}
    <div class="field" style="max-width:280px;margin-top:10px;"><label>Margen de ganancia sobre el costo</label><input id="v-margen" type="number" step="any" value="${PV.margen}"><span class="u">Ej: 0.35 = 35% sobre el costo unitario</span></div>
    <div class="grid grid-2" style="margin-top:10px;">
      ${calcBox('Costo Unitario de Producción', money(M.precioVenta.costoUnitario))}
      ${calcBox('Precio de Venta Unitario (PVU)', money(M.precioVenta.pvu), 'Costo unitario × (1 + margen)')}
    </div>`;

  const CR = V.crecimiento, OF = V.otrosFinancieros;
  const b8 = `<div class="field-row">
      <div class="field"><label>Tasa de crecimiento anual de ventas</label><input id="v-tasaCrecimiento" type="number" step="any" value="${CR.tasaCrecimientoVentas}"></div>
      <div class="field"><label>Inflación anual de costos y gastos</label><input id="v-inflacion" type="number" step="any" value="${CR.inflacionCostos}"></div>
    </div>
    <h4 style="font-size:13px;margin:14px 0 6px;">Datos para análisis de sensibilidad</h4>
    <div class="field-row">
      <div class="field"><label>Escenario 1: disminución de ventas</label><input id="v-sensMenos5" type="number" step="any" value="${CR.sensibilidadMenos5}"><span class="u">0.05 = disminución de ventas del 5%</span></div>
      <div class="field"><label>Escenario 2: disminución de ventas</label><input id="v-sensMenos10" type="number" step="any" value="${CR.sensibilidadMenos10}"><span class="u">0.10 = disminución de ventas del 10%</span></div>
      <div class="field"><label>Escenario 3: otra disminución de ventas</label><input id="v-sensPersonalizada" type="number" step="any" placeholder="Dejar vacío o ingresar porcentaje" value="${CR.sensibilidadPersonalizada===null||CR.sensibilidadPersonalizada===undefined?'':CR.sensibilidadPersonalizada}"><span class="u">Ingresa la magnitud; el escenario se aplica como disminución (0.20 = −20%)</span></div>
    </div>
    <h4 style="font-size:13px;margin:14px 0 6px;">Otros datos financieros (para Ke)</h4>
    <div class="field-row">
      <div class="field"><label>Tasa libre de riesgo (Rf)</label><input id="v-rf" type="number" step="any" value="${OF.rf}"></div>
      <div class="field"><label>Prima de riesgo de mercado (MRP)</label><input id="v-mrp" type="number" step="any" value="${OF.mrp}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Beta desapalancada del sector</label><input id="v-beta" type="number" step="any" value="${OF.beta}"></div>
      <div class="field"><label>Riesgo país</label><input id="v-riesgoPais" type="number" step="any" value="${OF.riesgoPais}"></div>
    </div>
    <div class="grid grid-2">
      ${calcBox('Ke (Costo del Capital Propio)', pct(M.ke.ke), 'Rf + (β × MRP) + Riesgo País')}
      ${calcBox('WACC', pct(M.wacc.wacc), 'Costo promedio ponderado del capital')}
    </div>`;

  const b9 = `<div class="empty-hint">Selecciona la fecha de inicio y la fecha final de cada actividad con el calendario. La duración total del cronograma se calcula automáticamente desde la fecha de inicio más temprana hasta la fecha final más tardía — las actividades que empiezan y terminan el mismo día no alargan el total por sí solas.</div>
    ${itemsTable(V.cronograma.items, [{key:'nombre',label:'Actividad',type:'text'},{key:'fechaInicio',label:'Fecha de Inicio',type:'date'},{key:'fechaFinal',label:'Fecha Final',type:'date',minKey:'fechaInicio'}], 'cronograma.items')}
    <div class="grid grid-2" style="margin-top:10px;">
      ${calcBox('N° de Actividades', V.cronograma.items.length)}
      ${calcBox('Duración Total del Cronograma', M.cronograma.totalDias+' días')}
    </div>`;

  const blocks = [b0,b1,b2,b3,bSum,b4,b5,b6,b7,b8,b9];
  const nextIdx = VARBLOCKS.findIndex((b,i)=> !state.doneAccordions[i]);
  return `<div class="topbar"><div><div class="crumbs">Única pantalla editable</div><h1>Variables del Proyecto</h1></div><div class="actions"><span class="badge info">${Object.keys(state.doneAccordions).length}/${VARBLOCKS.length} bloques completados</span></div></div>
  <div class="empty-hint">Completa cada bloque, dale "Guardar" y pasa al siguiente bloque resaltado en dorado. Todo se recalcula automáticamente mientras escribes.</div>
  ${VARBLOCKS.map((b,i)=> accordionBlock(i, b.nombre, blocks[i], i===nextIdx)).join('')}`;
}

/* ---------- 11. HELPERS DE TABLAS / EXPORTACIÓN ---------- */
function sheetHeader(title, subtitle, sheetId){
  return `<div class="topbar"><div><div class="crumbs">Pestaña de solo lectura</div><h1>${title}</h1>${subtitle?`<div class="sub">${subtitle}</div>`:''}</div>
  <div class="actions"><button class="btn btn-sm" data-exportxlsx="${sheetId}">⬇ Excel</button><button class="btn btn-sm btn-primary" data-exportword="${sheetId}">⬇ Word</button></div></div>`;
}
function tbl(headers, rows, opts={}){
  const totalIdx = opts.totalRow;
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th class="${h.num?'num':''}">${h.label}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((r,i)=>`<tr class="${totalIdx===i?'total':''}">${r.map((c,j)=>`<td class="${headers[j]&&headers[j].num?'num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function capTbl(caption, headers, rows, opts={}){ return `<h4 style="font-size:13px;margin:14px 0 6px;">${caption}</h4>${tbl(headers, rows, opts)}`; }

/* Mini-dashboard de KPIs por pestaña */
function kpiRow(items){
  if (!items || !items.length) return '';
  const colors = ['','c-blue','c-gold','c-red'];
  return `<div class="grid grid-4" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px;">${items.map((it,i)=>`
    <div class="kpi ${colors[i%colors.length]}"><div class="bar"></div><div class="lbl">${it.label}</div><div class="val">${it.value}</div>${it.hint?`<div class="hint">${it.hint}</div>`:''}</div>`).join('')}</div>`;
}
function sheetKpis(id, M){
  switch(id){
    case 'cuadro': return [ {label:'Inversión Total', value:money(M.inversion.total)}, {label:'% Capital Propio', value:pct(M.inversion.pctPropio)}, {label:'% Financiado', value:pct(M.inversion.pctAjeno)}, {label:'Capital de Trabajo', value:money(M.inversion.capitalTrabajo)} ];
    case 'flujoinv': return [ {label:'Activos Fijos', value:money(M.inversion.activosFijos)}, {label:'Diferidos', value:money(M.inversion.diferidos)}, {label:'Capital de Trabajo', value:money(M.inversion.capitalTrabajo)}, {label:'Inversión Total', value:money(M.inversion.total)} ];
    case 'estfin': return [ {label:'Aporte Socios', value:money(M.inversion.aporteSocios)}, {label:'Préstamo', value:money(M.inversion.montoPrestamo)}, {label:'N° Socios', value:M.financiamiento.numSocios}, {label:'Tasa Préstamo', value:pct(M.financiamiento.tasaInteres)} ];
    case 'diferidos': return [ {label:'Total Diferidos', value:money(M.diferidos.total)}, {label:'Amortización Anual', value:money(M.diferidos.amortAnual)}, {label:'Años de Amortización', value:M.diferidos.aniosAmort} ];
    case 'obras': return [ {label:'Área Total', value:fmt(M.areas.areaTotal,2)+' m²'}, {label:'Valor por m²', value:money(M.areas.valorM2)}, {label:'Alquiler Mensual', value:money(M.areas.valorAlquilerMensual)} ];
    case 'depre': return [ {label:'Total Activos Fijos', value:money(M.activos.totalActivosFijos)}, {label:'Depreciación Anual', value:money(M.activos.depAnualTotal)}, {label:'Valor Residual', value:pct(M.activos.valorResidualPct)} ];
    case 'capital': return [ {label:'Costo de Producción Mensual', value:money(M.costeoProduccion.costoTotalMensual)}, {label:'Capital de Trabajo', value:money(M.capitalTrabajo.total)}, {label:'Meses Cubiertos', value:M.capitalTrabajo.meses}, {label:'Costos Operativos/Mes', value:money(M.capitalTrabajo.costosOperativosMensuales)} ];
    case 'rol': { const totalNeto=M.personal.empleados.reduce((s,e)=>s+e.netoTotal,0); const totalIess=M.personal.empleados.reduce((s,e)=>s+e.iessPersonal*e.puestos,0); return [ {label:'Total Neto Mensual', value:money(totalNeto)}, {label:'N° Empleados', value:M.personal.empleados.reduce((s,e)=>s+Number(e.puestos),0)}, {label:'IESS Personal Descontado', value:money(totalIess)} ]; }
    case 'provisiones': return [ {label:'Total Provisiones', value:money(M.personal.empleados.reduce((s,e)=>s+e.totalProvisionesGrupo,0))}, {label:'Costo Total Empresa', value:money(M.personal.totalMensual)}, {label:'IESS Patronal Total', value:money(M.personal.empleados.reduce((s,e)=>s+e.iessPatronal*e.puestos,0))} ];
    case 'nominafuncion': return [ {label:'Admin. + Ventas', value:money(M.personal.porFuncion.Administracion+M.personal.porFuncion.Ventas)}, {label:'Mano de Obra Indirecta', value:money(M.personal.porFuncion.MOI)}, {label:'Mano de Obra Directa', value:money(M.personal.porFuncion.MOD)} ];
    case 'materiaprima': return [ {label:'Total Mensual', value:money(M.materiaPrima.total)}, {label:'Unidades de Referencia', value:fmt(M.produccion.produccionMensual,2)}, {label:'N° de Ítems', value:M.materiaPrima.items.length} ];
    case 'insumos': return [ {label:'Total Materiales Indirectos', value:money(M.materialesIndirectos.total)}, {label:'N° de Ítems', value:M.materialesIndirectos.items.length} ];
    case 'suminoficina': return [ {label:'Total Suministros de Oficina', value:money(M.suministrosOficina.total)}, {label:'N° de Ítems', value:M.suministrosOficina.items.length} ];
    case 'suminlimpieza': return [ {label:'Total Suministros de Limpieza', value:money(M.suministrosLimpieza.total)}, {label:'N° de Ítems', value:M.suministrosLimpieza.items.length} ];
    case 'cfijos': return [ {label:'Total Costos Fijos', value:money(M.puntoEquilibrio.costosFijosMensuales)}, {label:'Sueldos Adm+Vtas', value:money(M.personal.porFuncion.Administracion+M.personal.porFuncion.Ventas)}, {label:'CIF Adm+Vtas (con Dep.)', value:money(M.cif.cifAdminConDep+M.cif.cifVentasConDep)} ];
    case 'gastosadmven': return [ {label:'Total Administración', value:money(M.gastosAdminVentas.totalAdmin)}, {label:'Total Ventas', value:money(M.gastosAdminVentas.totalVentas)}, {label:'Total General', value:money(M.gastosAdminVentas.totalGeneral)} ];
    case 'cif': return [ {label:'CIF Administración (con Dep.)', value:money(M.cif.cifAdminConDep)}, {label:'CIF Ventas (con Dep.)', value:money(M.cif.cifVentasConDep)}, {label:'CIF Planta (con Mat. Indirectos, MOI y Dep.)', value:money(M.cif.cifPlantaCompleto)}, {label:'Total CIF de Producción', value:money(M.cif.totalCompleto)} ];
    case 'cprod': return [ {label:'Costo Total Mensual', value:money(M.costeoProduccion.costoTotalMensual)}, {label:'Costo Unitario', value:money(M.costeoProduccion.costoUnitario)}, {label:'Producción Mensual', value:fmt(M.produccion.produccionMensual,2)} ];
    case 'cproy': { const a1=M.costosProyectados[0].total, a5=M.costosProyectados[4].total; return [ {label:'Total Año 1', value:money(a1)}, {label:'Total Año 5', value:money(a5)}, {label:'Inflación Aplicada', value:pct(M.crecimiento.inflacionCostos)} ]; }
    case 'pe': return [ {label:'P.E. Unidades/Año', value:isFinite(M.puntoEquilibrio.peUnidadesAnual)?fmt(M.puntoEquilibrio.peUnidadesAnual,2):'N/D'}, {label:'P.E. Ingresos/Año', value:money(M.puntoEquilibrio.peIngresosAnual)}, {label:'Margen de Contribución', value:money(M.puntoEquilibrio.mcu)} ];
    case 'pventa': return [ {label:'Precio Propio', value:money(M.precioVenta.pvu)}, {label:'Promedio Competencia', value:money(M.precioVenta.promCompetencia)}, {label:'Margen Aplicado', value:pct(M.precioVenta.margen)} ];
    case 'crecimiento': return [ {label:'Tasa de Crecimiento', value:pct(M.crecimiento.tasaCrecimientoVentas)}, {label:'Unidades Año 1', value:fmt(M.ingresosProyectados[0].unidades,2)}, {label:'Unidades Año 5', value:fmt(M.ingresosProyectados[4].unidades,2)} ];
    case 'ingresos': { const crecTotal = M.ingresosProyectados[0].ingreso? (M.ingresosProyectados[4].ingreso/M.ingresosProyectados[0].ingreso-1):0; return [ {label:'Ingreso Año 1', value:money(M.ingresosProyectados[0].ingreso)}, {label:'Ingreso Año 5', value:money(M.ingresosProyectados[4].ingreso)}, {label:'Crecimiento Total', value:pct(crecTotal)} ]; }
    case 'estres': return [ {label:'Utilidad Neta Año 1', value:money(M.estadoResultados[0].utilidadNeta)}, {label:'Utilidad Neta Año 5', value:money(M.estadoResultados[4].utilidadNeta)}, {label:'Margen Neto Año 1', value:pct(M.indicadores[0].margenNeto)} ];
    case 'balance': return [ {label:'Total Activo Año 5', value:money(M.balance[5].totalActivo)}, {label:'Préstamo Año 5', value:money(M.balance[5].prestamo)}, {label:'Patrimonio Año 5', value:money(M.balance[5].capitalSocial+M.balance[5].utilidadesRetenidas)} ];
    case 'amort': return [ {label:'Monto del Préstamo', value:money(M.amortizacion.principal)}, {label:'Interés Total Pagado', value:money(M.amortizacion.rows.reduce((s,r)=>s+r.interes,0))}, {label:'Capital Total Pagado', value:money(M.amortizacion.rows.reduce((s,r)=>s+r.capital,0))} ];
    case 'ke': return [ {label:'Ke', value:pct(M.ke.ke)}, {label:'Tasa Libre de Riesgo', value:pct(M.ke.rf)}, {label:'Beta', value:fmt(M.ke.beta,3)} ];
    case 'wacc': return [ {label:'WACC', value:pct(M.wacc.wacc)}, {label:'Ke', value:pct(M.wacc.ke)}, {label:'Rd (Costo Deuda)', value:pct(M.wacc.rd)} ];
    case 'supuestosflujo': return [ {label:'WACC', value:pct(M.wacc.wacc)}, {label:'Ke', value:pct(M.ke.ke)}, {label:'Crecimiento Ventas', value:pct(M.crecimiento.tasaCrecimientoVentas)} ];
    case 'desecho': return [ {label:'Costo Total de Activos', value:money(M.activos.totalActivosFijos)}, {label:'Depreciación Acumulada Año 5', value:money(M.desecho.detalleActivos.reduce((s,it)=>s+it.depreciacionAcumulada,0))}, {label:'Valor de Desecho Contable', value:money(M.desecho.total)} ];
    case 'depflujos': return [ {label:'Depreciación Anual', value:money(M.activos.depAnualTotal)}, {label:'Amortización Diferidos', value:money(M.diferidos.amortAnual)}, {label:'Total Addback Anual', value:money(M.activos.depAnualTotal+M.diferidos.amortAnual)} ];
    case 'fce': return [ {label:'VAN Económico', value:money(M.fce.van)}, {label:'TIR Económica', value:isFinite(M.fce.tir)?pct(M.fce.tir):'N/D'}, {label:'Payback Nominal', value:isFinite(M.payback.economico)?fmt(M.payback.economico,2)+' años':'N/D'}, {label:'Valor de Desecho', value:money(M.desecho.total)}, {label:'WACC', value:pct(M.fce.tasa)} ];
    case 'fcf': return [ {label:'VAN Financiero', value:money(M.fcf.van)}, {label:'TIR Financiera', value:isFinite(M.fcf.tir)?pct(M.fcf.tir):'N/D'}, {label:'Payback Nominal', value:isFinite(M.payback.financiero)?fmt(M.payback.financiero,2)+' años':'N/D'}, {label:'Aporte de Socios', value:money(M.inversion.aporteSocios)}, {label:'Valor de Desecho', value:money(M.desecho.total)}, {label:'Ke', value:pct(M.fcf.tasa)} ];
    case 'vantir': return [ {label:'VAN Económico', value:money(M.fce.van)}, {label:'VAN Financiero', value:money(M.fcf.van)}, {label:'Veredicto', value:(M.fce.van>0&&M.fcf.van>0)?'Viable':'Revisar'} ];
    case 'payback': return [ {label:'Payback Económico', value:isFinite(M.payback.economico)?fmt(M.payback.economico,2)+' años':'N/D'}, {label:'Payback Financiero', value:isFinite(M.payback.financiero)?fmt(M.payback.financiero,2)+' años':'N/D'} ];
    case 'indic': return [ {label:'Margen Neto Año 1', value:pct(M.indicadores[0].margenNeto)}, {label:'ROE Año 1', value:pct(M.indicadores[0].roe)}, {label:'Endeudamiento Año 1', value:pct(M.indicadores[0].endeudamiento)} ];
    case 'sens': { const vals=M.escenariosSensibilidad.filter(s=>s.activo).flatMap(s=>[s.modelo.fce.van,s.modelo.fcf.van]).filter(v=>isFinite(v)); return [ {label:'Escenarios configurados', value:M.escenariosSensibilidad.filter(s=>s.activo).length+' de 3'}, {label:'VAN Mínimo', value:vals.length?money(Math.min(...vals)):'N/D'}, {label:'VAN Máximo', value:vals.length?money(Math.max(...vals)):'N/D'} ]; }
    case 'resultados': return [ {label:'VAN Económico',value:money(M.fce.van)}, {label:'VAN del Inversionista',value:money(M.fcf.van)}, {label:'Payback Descontado Económico',value:isFinite(M.paybackDescontado.economico)?fmt(M.paybackDescontado.economico,2)+' años':'No recupera'}, {label:'Payback Descontado Financiero',value:isFinite(M.paybackDescontado.financiero)?fmt(M.paybackDescontado.financiero,2)+' años':'No recupera'} ];
    case 'cronograma': return [ {label:'N° de Actividades', value:M.cronograma.items.length}, {label:'Duración Total', value:M.cronograma.totalDias+' días'} ];
    default: return [];
  }
}

/* ---------- 11.5 ANÁLISIS FINANCIERO EXPERTO (por pestaña) ---------- */
function sheetAnalysis(id, M){
  const b = sheetAnalysisBullets(id, M);
  if (!b.length) return '';
  return `<div class="card"><h3>📊 Análisis Financiero</h3><ul style="margin:0;padding-left:18px;color:var(--text-muted);font-size:13px;line-height:1.7;">${b.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}
function sheetAnalysisBullets(id, M){
  const b = []; // bullets
  switch(id){
    case 'cuadro': {
      b.push(M.inversion.pctAjeno>0.6? `El proyecto depende fuertemente del financiamiento externo (${pct(M.inversion.pctAjeno)}), lo que eleva el riesgo financiero y el gasto por intereses.` : `La estructura de capital está razonablemente equilibrada: ${pct(M.inversion.pctPropio)} propio y ${pct(M.inversion.pctAjeno)} financiado.`);
      b.push(M.capitalTrabajo.total>M.activos.totalActivosFijos? `El capital de trabajo (${money(M.capitalTrabajo.total)}) supera la inversión en activos fijos: es un negocio intensivo en operación, no en infraestructura.` : `La inversión en activos fijos (${money(M.activos.totalActivosFijos)}) es el componente principal de la inversión total.`);
      b.push(`La inversión total de ${money(M.inversion.total)} debe recuperarse en un plazo razonable frente al horizonte de evaluación de 5 años (ver Payback).`);
      break;
    }
    case 'flujoinv': {
      b.push(`El desembolso en el año 0 es de ${money(M.inversion.total)}; ninguna otra salida de caja de esta magnitud ocurre en los años siguientes.`);
      b.push(M.inversion.capitalTrabajo/M.inversion.total>0.5? `Más de la mitad de la inversión inicial (${pct(M.inversion.capitalTrabajo/M.inversion.total)}) es capital de trabajo, lo que indica bajo requerimiento de activos duros.` : `Los activos fijos y diferidos concentran la mayor parte de la inversión inicial.`);
      break;
    }
    case 'estfin': {
      b.push(M.inversion.pctPropio>=0.5? `Los socios aportan la mayoría del capital (${pct(M.inversion.pctPropio)}), lo que reduce el riesgo de sobreendeudamiento.` : `El préstamo bancario financia la mayoría de la inversión (${pct(M.inversion.pctAjeno)}); conviene evaluar la capacidad de pago frente al flujo operativo.`);
      b.push(`Con ${M.financiamiento.numSocios} socio(s), el aporte individual promedio es de ${money(M.inversion.aporteSocios/(M.financiamiento.numSocios||1))}.`);
      break;
    }
    case 'diferidos': {
      const pctDif = M.inversion.total? M.diferidos.total/M.inversion.total : 0;
      b.push(pctDif<0.05? `Los gastos de constitución representan solo ${pct(pctDif)} de la inversión total: no son un factor crítico para la viabilidad.` : `Los gastos de constitución (${pct(pctDif)} de la inversión) son relativamente altos; revisa si todos son estrictamente necesarios antes de operar.`);
      break;
    }
    case 'obras': {
      b.push(`El costo por m² (${money(M.areas.valorM2)}) se aplica proporcionalmente a Planta, Administración y Ventas según el área ocupada por cada una.`);
      b.push(M.areas.pctPlanta>0.5? `Planta ocupa más de la mitad del área total (${pct(M.areas.pctPlanta)}), coherente con un negocio de producción.` : `El área operativa está distribuida de forma relativamente equilibrada entre planta, administración y ventas.`);
      break;
    }
    case 'depre': {
      const catTop = [...M.activos.categorias].sort((a,b2)=>b2.total-a.total)[0];
      if (catTop && catTop.total>0) b.push(`"${catTop.nombre}" concentra el mayor valor en activos fijos (${money(catTop.total)}), y por tanto el mayor peso en la depreciación anual.`);
      b.push(`La depreciación anual total (${money(M.activos.depAnualTotal)}) es un costo no monetario que reduce la utilidad contable pero no representa salida de caja — por eso se suma de vuelta en los flujos.`);
      break;
    }
    case 'capital': {
      const pctFijo = M.capitalTrabajo.costosOperativosMensuales? (M.personal.porFuncion.Administracion+M.personal.porFuncion.Ventas+M.cif.cifAdminConDep+M.cif.cifVentasConDep)/M.capitalTrabajo.costosOperativosMensuales : 0;
      b.push(`El capital de trabajo cubre ${M.capitalTrabajo.meses} mes(es) de operación (${money(M.capitalTrabajo.total)}); si el ciclo de cobro es más largo que eso, el negocio podría enfrentar tensión de liquidez.`);
      b.push(pctFijo>0.4? `Los costos administrativos y de ventas representan ${pct(pctFijo)} del costo operativo mensual — vale la pena revisar si esa estructura fija es proporcional al tamaño de las ventas.` : `El costo de producción domina la estructura operativa mensual, típico de un negocio con foco en manufactura.`);
      break;
    }
    case 'rol': {
      const totalBruto = M.personal.empleados.reduce((s,e)=>s+e.remuneracion*e.puestos,0);
      const totalNeto = M.personal.empleados.reduce((s,e)=>s+e.netoTotal,0);
      b.push(`El descuento total por aporte personal a la seguridad social es de ${money(totalBruto-totalNeto)} mensuales sobre la nómina bruta.`);
      break;
    }
    case 'provisiones': {
      b.push(`Las provisiones sociales (décimos, vacaciones, fondo de reserva, IESS patronal) elevan el costo real de la nómina en ${money(M.personal.totalMensual-M.personal.empleados.reduce((s,e)=>s+e.remuneracion*e.puestos,0))} mensuales sobre el sueldo nominal — este es el "costo empresa" real, no solo el sueldo pactado.`);
      break;
    }
    case 'nominafuncion': {
      const pf = M.personal.porFuncion; const max = Object.entries(pf).sort((a,b2)=>b2[1]-a[1])[0];
      b.push(`La función con mayor costo de nómina es ${max[0]} (${money(max[1])} mensuales), lo que sugiere dónde está concentrado el gasto de personal.`);
      break;
    }
    case 'materiaprima': {
      b.push(`El costo unitario de materia prima (${money(M.materiaPrima.costoUnitario)}) representa ${pct(M.materiaPrima.costoUnitario/(M.precioVenta.pvu||1))} del precio de venta unitario — a mayor proporción, menor margen disponible para cubrir otros costos.`);
      break;
    }
    case 'insumos': {
      const pctMI = M.costeoProduccion.costoTotalMensual? M.materialesIndirectos.total/M.costeoProduccion.costoTotalMensual : 0;
      b.push(`Los materiales indirectos (${money(M.materialesIndirectos.total)} mensuales) representan ${pct(pctMI)} del costo total de producción — un componente secundario frente a materia prima y mano de obra directa.`);
      break;
    }
    case 'suminoficina': case 'suminlimpieza': {
      b.push(`Este inventario es de control interno y no impacta el costeo de producción ni el punto de equilibrio — solo el flujo de caja operativo general.`);
      break;
    }
    case 'cfijos': {
      b.push(`Los costos fijos mensuales (${money(M.puntoEquilibrio.costosFijosMensuales)}) determinan directamente el punto de equilibrio: cualquier reducción aquí baja el nivel de ventas necesario para no perder dinero.`);
      break;
    }
    case 'gastosadmven': {
      b.push(M.gastosAdminVentas.totalAdmin>M.gastosAdminVentas.totalVentas? `Administración (${money(M.gastosAdminVentas.totalAdmin)}) pesa más que Ventas (${money(M.gastosAdminVentas.totalVentas)}) en la estructura de gastos operativos — vale la pena evaluar si la estructura administrativa es proporcional al tamaño del negocio.` : `Ventas (${money(M.gastosAdminVentas.totalVentas)}) representa un gasto mayor que Administración (${money(M.gastosAdminVentas.totalAdmin)}), coherente con un negocio enfocado en comercialización.`);
      break;
    }
    case 'cif': {
      b.push(`Los Costos Indirectos de Fabricación de Planta (${money(M.cif.cifPlantaCompleto)}, incluyendo materiales indirectos y mano de obra indirecta) forman parte del costo de producción y afectan directamente el margen bruto.`);
      break;
    }
    case 'cprod': {
      const c=M.costeoProduccion; const pctMP = c.costoTotalMensual? c.materiaPrima/c.costoTotalMensual:0;
      b.push(`La materia prima representa ${pct(pctMP)} del costo total de producción — es el componente más sensible a variaciones de precio de insumos (ver Análisis de Sensibilidad).`);
      break;
    }
    case 'cproy': {
      const a1=M.costosProyectados[0].total, a5=M.costosProyectados[4].total;
      b.push(`Los costos y gastos totales crecen de ${money(a1)} en el año 1 a ${money(a5)} en el año 5 (${pct(a5/a1-1)} acumulado), combinando crecimiento de volumen (${pct(M.crecimiento.tasaCrecimientoVentas)} anual) e inflación (${pct(M.crecimiento.inflacionCostos)} anual).`);
      break;
    }
    case 'pe': {
      const margen = M.produccion.produccionMensual && isFinite(M.puntoEquilibrio.peUnidadesMensual)? (M.produccion.produccionMensual/M.puntoEquilibrio.peUnidadesMensual - 1) : NaN;
      b.push(isFinite(margen)? (margen>=0? `Tu producción planificada supera el punto de equilibrio en ${pct(margen)} — ese es tu margen de seguridad operativo.` : `Tu producción planificada está ${pct(Math.abs(margen))} por debajo del punto de equilibrio: el negocio, tal como está configurado, no cubre sus costos fijos.`) : `No se pudo calcular el margen de seguridad; revisa que el precio de venta sea mayor al costo variable unitario.`);
      break;
    }
    case 'pventa': {
      b.push(M.precioVenta.pvu>M.precioVenta.promCompetencia? `Tu precio propio (${money(M.precioVenta.pvu)}) está por encima del promedio de la competencia (${money(M.precioVenta.promCompetencia)}) — necesitas un argumento de valor claro para justificarlo ante el cliente.` : `Tu precio propio (${money(M.precioVenta.pvu)}) es competitivo frente al promedio del mercado (${money(M.precioVenta.promCompetencia)}).`);
      break;
    }
    case 'crecimiento': {
      b.push(M.crecimiento.tasaCrecimientoVentas>0.15? `Una tasa de crecimiento de ${pct(M.crecimiento.tasaCrecimientoVentas)} anual es ambiciosa — confirma que tu capacidad instalada y tu capital de trabajo puedan sostenerla.` : `La tasa de crecimiento de ${pct(M.crecimiento.tasaCrecimientoVentas)} anual es moderada y razonablemente sostenible.`);
      break;
    }
    case 'ingresos': {
      const cagr = M.ingresosProyectados[0].ingreso? Math.pow(M.ingresosProyectados[4].ingreso/M.ingresosProyectados[0].ingreso, 1/4)-1 : 0;
      b.push(`Los ingresos crecen a una tasa compuesta (CAGR) de ${pct(cagr)} anual entre el año 1 y el año 5.`);
      break;
    }
    case 'estres': {
      const m1=M.indicadores[0].margenNeto, m5=M.indicadores[4].margenNeto;
      b.push(m5<m1? `El margen neto se contrae de ${pct(m1)} en el año 1 a ${pct(m5)} en el año 5 — esto ocurre porque los costos suben con la inflación mientras el precio de venta se mantiene fijo. Considera una política de ajuste anual de precios.` : `El margen neto mejora de ${pct(m1)} en el año 1 a ${pct(m5)} en el año 5, señal de que el crecimiento en ventas diluye los costos fijos más rápido de lo que suben los costos totales.`);
      break;
    }
    case 'balance': {
      const b0=M.balance[0].prestamo, b5=M.balance[5].prestamo;
      b.push(`El saldo del préstamo baja de ${money(b0)} a ${money(b5)} en 5 años — la empresa reduce su apalancamiento a medida que paga el capital.`);
      b.push(M.balance[5].caja>0? `La caja proyectada al año 5 es positiva (${money(M.balance[5].caja)}), señal de liquidez sostenida si los supuestos se cumplen.` : `La caja proyectada al año 5 es negativa (${money(M.balance[5].caja)}) — revisa costos, precio o financiamiento antes de ejecutar el proyecto así.`);
      break;
    }
    case 'amort': {
      const first = M.amortizacion.rows[0], last = M.amortizacion.rows[M.amortizacion.rows.length-1];
      if (first && last) b.push(`El interés pagado baja de ${money(first.interes)} en el año 1 a ${money(last.interes)} en el último año del préstamo, típico del sistema de cuota fija (francés): al inicio se paga más interés y menos capital.`);
      break;
    }
    case 'ke': {
      b.push(M.ke.ke>0.20? `Un Ke de ${pct(M.ke.ke)} es alto — refleja una prima de riesgo país o de mercado elevada; es exigente para el proyecto generar ese retorno mínimo al inversionista.` : `El Ke de ${pct(M.ke.ke)} es un costo de oportunidad razonable para un proyecto de este tipo de riesgo.`);
      break;
    }
    case 'wacc': {
      b.push(`El WACC (${pct(M.wacc.wacc)}) es la tasa mínima que el proyecto debe superar para crear valor — compáralo siempre contra la TIR económica.`);
      break;
    }
    case 'supuestosflujo': {
      b.push(`Estos supuestos son la base de todo el análisis de rentabilidad — pequeños cambios en la tasa de crecimiento o el WACC pueden alterar significativamente el VAN (ver Análisis de Sensibilidad).`);
      break;
    }
    case 'desecho': {
      const pctDes = M.inversion.total? M.desecho.total/M.inversion.total:0;
      b.push(`El valor de desecho (${money(M.desecho.total)}) equivale a ${pct(pctDes)} de la inversión inicial y se recupera como ingreso adicional en el año 5, mejorando el VAN del proyecto.`);
      break;
    }
    case 'depflujos': {
      b.push(`Este addback (${money(M.activos.depAnualTotal+M.diferidos.amortAnual)} anuales) no es caja real disponible al inicio, pero sí mejora el flujo de caja del proyecto porque reduce la base imponible sin ser una salida de efectivo.`);
      break;
    }
    case 'fce': {
      b.push(M.fce.van>0? `El VAN económico es positivo (${money(M.fce.van)}): el proyecto genera valor incluso sin considerar cómo se financia.` : `El VAN económico es negativo (${money(M.fce.van)}): el proyecto no genera valor suficiente para cubrir el costo de capital, independientemente del financiamiento.`);
      break;
    }
    case 'fcf': {
      b.push(M.fcf.van>0? `Desde la óptica del inversionista (con financiamiento), el VAN es positivo (${money(M.fcf.van)}) — el apalancamiento no perjudica la rentabilidad del capital propio.` : `Desde la óptica del inversionista, el VAN es negativo (${money(M.fcf.van)}) — el costo de la deuda está erosionando el retorno del capital propio.`);
      break;
    }
    case 'vantir': {
      b.push(Math.abs(M.fce.van-M.fcf.van)>Math.abs(M.fce.van)*0.3? `Hay una diferencia notable entre el VAN económico y el financiero — el financiamiento tiene un impacto significativo (positivo o negativo) en la rentabilidad para el inversionista.` : `El VAN económico y el financiero son relativamente similares — el financiamiento no altera drásticamente la conclusión de viabilidad.`);
      break;
    }
    case 'payback': {
      b.push(isFinite(M.payback.economico)? (M.payback.economico<=3? `Un payback de ${fmt(M.payback.economico,2)} años es rápido, lo que reduce el riesgo de la inversión.` : `Un payback de ${fmt(M.payback.economico,2)} años es relativamente largo — el proyecto está más expuesto a cambios en el entorno durante ese tiempo.`) : `La inversión no se recupera dentro del horizonte de 5 años evaluado — es una señal de alerta importante.`);
      break;
    }
    case 'indic': {
      const roe1=M.indicadores[0].roe, roe5=M.indicadores[4].roe;
      b.push(isFinite(roe1)&&isFinite(roe5)? (roe5>roe1? `El ROE mejora de ${pct(roe1)} a ${pct(roe5)} en el horizonte — la rentabilidad sobre el patrimonio de los socios va en aumento.` : `El ROE se reduce de ${pct(roe1)} a ${pct(roe5)} — conviene monitorear qué está presionando la utilidad neta.`) : `Revisa que el patrimonio no esté en cero para poder calcular el ROE correctamente.`);
      break;
    }
    case 'sens': {
      const byVar={}; M.sensibilidad.forEach(s=>{ (byVar[s.variable]=byVar[s.variable]||[]).push(s.van); });
      let maxRange=0, maxVar='';
      Object.entries(byVar).forEach(([k,vals])=>{ const vv=vals.filter(isFinite); if(!vv.length) return; const range=Math.max(...vv)-Math.min(...vv); if(range>maxRange){maxRange=range; maxVar=k;} });
      if (maxVar) b.push(`"${maxVar}" es la variable que más mueve el VAN en este proyecto — es la que más vale la pena controlar y negociar con proveedores o clientes.`);
      break;
    }
    case 'cronograma': {
      b.push(`El arranque de operaciones toma aproximadamente ${M.cronograma.totalDias} días desde el inicio de las actividades — este período debe cubrirse con el capital de trabajo o aportes adicionales, ya que aún no hay ingresos.`);
      break;
    }
  }
  return b;
}

/* ---------- 12. RENDER DE CADA PESTAÑA ---------- */
function renderSheet(id, M){
  const meta = SHEETS.find(s=>s.id===id); const title = meta? meta.nombre : id;
  switch(id){

    case 'cuadro': {
      const rows = [['Activos Fijos', money(M.activos.totalActivosFijos)],['Gastos de Constitución', money(M.diferidos.total)],['Capital de Trabajo', money(M.capitalTrabajo.total)],['INVERSIÓN TOTAL', money(M.inversion.total)]];
      const fin = [['Capital Propio (Aporte de Socios)', money(M.inversion.aporteSocios), pct(M.inversion.pctPropio)],['Capital Ajeno (Préstamo Bancario)', money(M.inversion.montoPrestamo), pct(M.inversion.pctAjeno)]];
      return sheetHeader(title,'Resumen de la inversión inicial requerida y su financiamiento.', id) + kpiRow(sheetKpis(id, M)) + `<div class="two-col">
        <div class="card"><h3>Estructura de la Inversión</h3>${tbl([{label:'Concepto'},{label:'Valor',num:true}], rows, {totalRow:3})}</div>
        <div class="card"><h3>Financiamiento del Proyecto</h3>${tbl([{label:'Fuente'},{label:'Valor',num:true},{label:'%',num:true}], fin)}<div class="chart-box sm" style="margin-top:14px;"><canvas id="chFinanciamiento"></canvas></div></div>
      </div>`;
    }

    case 'flujoinv': {
      const rows = [['Activos Fijos', money(M.inversion.activosFijos)],['Gastos de Constitución', money(M.inversion.diferidos)],['Capital de Trabajo', money(M.inversion.capitalTrabajo)],['INVERSIÓN TOTAL (Año 0)', money(M.inversion.total)]];
      return sheetHeader(title,'Desembolso necesario en el momento cero del proyecto, antes de iniciar operaciones.', id) + kpiRow(sheetKpis(id, M)) + `<div class="two-col"><div class="card">${tbl([{label:'Concepto'},{label:'Valor',num:true}], rows, {totalRow:3})}</div><div class="card"><h3>Composición de la Inversión</h3><div class="chart-box sm"><canvas id="chFlujoInv"></canvas></div></div></div>`;
    }

    case 'estfin': {

    }

    case 'balance': {
      const heads = [{label:'Cuenta'}].concat(M.balance.map(r=>({label:'Año '+r.anio, num:true})));
      const line=(label,key)=>[label, ...M.balance.map(r=>money(r[key]))];
      const rows = [line('Caja / Bancos','caja'), line('Activo Fijo Neto','activoFijoNeto'), line('Activo Diferido Neto','activoDiferidoNeto'), line('TOTAL ACTIVO','totalActivo'), line('Préstamo por Pagar','prestamo'), line('Capital Social','capitalSocial'), line('Utilidades Retenidas','utilidadesRetenidas'), line('TOTAL PASIVO + PATRIMONIO','totalPasivoPatrimonio')];
      return sheetHeader(title,'Balance general proyectado (año 0 a 5), construido a partir del flujo de caja acumulado.', id) + kpiRow(sheetKpis(id, M)) + `<div class="card">${tbl(heads, rows, {totalRow:3})}</div><div class="card"><h3>Composición del Activo</h3><div class="chart-box"><canvas id="chBalance"></canvas></div></div>`;
    }

    case 'ke': {
      const k = M.ke;
      const rows = [['Tasa Libre de Riesgo (Rf)', pct(k.rf)],['Beta desapalancada del sector', fmt(k.beta,3)],['Prima de Riesgo de Mercado (MRP)', pct(k.mrp)],['Riesgo País', pct(k.riesgoPais)],['Ke = Rf + (β × MRP) + Riesgo País', pct(k.ke)]];
      return sheetHeader(title,'Costo de oportunidad exigido por el inversionista (capital propio).', id) + kpiRow(sheetKpis(id, M)) + `<div class="two-col"><div class="card">${tbl([{label:'Componente'},{label:'Valor',num:true}], rows, {totalRow:4})}</div><div class="card"><h3>Composición del Ke</h3><div class="chart-box sm"><canvas id="chKe"></canvas></div></div></div>`;
    }

    case 'wacc': {
      const w = M.wacc;
      const rows = [['E/V — Peso del Capital Propio', pct(w.ev)],['D/V — Peso del Capital Ajeno', pct(w.dv)],['Ke — Costo del Capital Propio', pct(w.ke)],['Rd — Costo de la Deuda', pct(w.rd)],['Ti — Tasa de Impuesto a la Renta', pct(w.ti)],['WACC = (E/V×Ke) + (D/V×Rd×(1-Ti))', pct(w.wacc)]];
      return sheetHeader(title,'Costo promedio ponderado del capital, usado para descontar el flujo de caja del proyecto.', id) + kpiRow(sheetKpis(id, M)) + `<div class="two-col"><div class="card">${tbl([{label:'Componente'},{label:'Valor',num:true}], rows, {totalRow:5})}</div><div class="card"><h3>Ke vs. Rd vs. WACC</h3><div class="chart-box sm"><canvas id="chWacc"></canvas></div></div></div>`;
    }

    case 'supuestosflujo': {
      const rows = [['Horizonte de proyección', '5 años'],['Tasa de crecimiento de ventas', pct(M.crecimiento.tasaCrecimientoVentas)],['Inflación de costos y gastos', pct(M.crecimiento.inflacionCostos)],['WACC (tasa de descuento económico)', pct(M.wacc.wacc)],['Ke (tasa de descuento financiero)', pct(M.ke.ke)],['Tasa de impuesto a la renta', pct(M.financiamiento.impuestoRenta)],['% Participación trabajadores', pct(M.financiamiento.participacionEmpleados)],['Tasa de interés del préstamo', pct(M.financiamiento.tasaInteres)],['Plazo del préstamo', M.financiamiento.plazoAnios+' años'],['% Capital propio / ajeno', pct(M.inversion.pctPropio)+' / '+pct(M.inversion.pctAjeno)]];
      return sheetHeader(title,'Resumen de todos los supuestos usados para construir los flujos de caja.', id) + kpiRow(sheetKpis(id, M)) + `<div class="two-col"><div class="card">${tbl([{label:'Variable'},{label:'Valor',num:true}], rows)}</div><div class="card"><h3>Tasas clave (%)</h3><div class="chart-box sm"><canvas id="chSupuestosFlujo"></canvas></div></div></div>`;
    }

    case 'desecho': {
      const d = M.desecho;
      const rows=d.detalleActivos.map(it=>[it.nombre, money(it.total), it.vidaUtil, money(it.depAnual), money(it.depreciacionAcumulada), money(it.valorEnLibros)]);
      const totalDep=d.detalleActivos.reduce((s,it)=>s+it.depreciacionAcumulada,0);
      rows.push(['TOTALES', money(M.activos.totalActivosFijos), '', money(M.activos.depAnualTotal), money(totalDep), money(d.total)]);
      const otherRows=[['Activo Diferido Neto (año 5)',money(d.activoDiferidoNetoFinal)],['Capital de Trabajo (referencial)',money(d.capitalTrabajoRecuperado)],['VALOR DE DESECHO CONTABLE INCLUIDO EN FCE',money(d.total)]];
      return sheetHeader(title,'Memoria de cálculo detallada al finalizar el año 5. El valor de desecho contable incluido en el flujo corresponde al valor en libros de los activos fijos.', id) + kpiRow(sheetKpis(id, M)) + `<div class="card"><h3>Memoria de Cálculo Detallada (al finalizar el Año 5)</h3>${tbl([{label:'Ítem'},{label:'Costo Total',num:true},{label:'Vida Útil (Años)',num:true},{label:'Depreciación Anual',num:true},{label:'Dep. Acumulada (Año 5)',num:true},{label:'Valor en Libros (Año 5)',num:true}], rows, {totalRow:rows.length-1})}</div><div class="two-col"><div class="card"><h3>Otros saldos al cierre (no incluidos en el valor de desecho contable)</h3>${tbl([{label:'Concepto'},{label:'Valor',num:true}], otherRows, {totalRow:2})}</div><div class="card"><h3>Valor en libros de activos fijos por categoría</h3><div class="chart-box sm"><canvas id="chDesecho"></canvas></div></div></div>`;
    }

    case 'depflujos': {
      const rows = M.costosProyectados.map(r=>['Año '+r.anio, money(r.depreciacion), money(r.amortizacion), money(r.depreciacion+r.amortizacion)]);
      return sheetHeader(title,'Depreciación y amortización de diferidos que se suman de vuelta al flujo de caja (no representan salida de efectivo).', id) + kpiRow(sheetKpis(id, M)) + `<div class="card">${tbl([{label:'Año'},{label:'Depreciación Activos Fijos',num:true},{label:'Amortización Diferidos',num:true},{label:'Total Addback',num:true}], rows)}</div><div class="card"><h3>Addback anual al flujo de caja</h3><div class="chart-box sm"><canvas id="chDepFlujos"></canvas></div></div>`;
    }

    case 'fce': {
      const heads=[{label:'Concepto'}, ...Array.from({length:M.fce.flows.length},(_,i)=>({label:'Año '+i,num:true}))];
      const annual=(label,key,negative=false,blankZero=false)=>[label,'',...M.fce.detalle.map(r=>blankZero&&r[key]===0?'':money(negative?-r[key]:r[key]))];
      const rows=[
        annual('Utilidad Operativa (EBIT)','ebit'),
        annual('(-) Participación Trabajadores','participacion',true),
        annual('Utilidad Antes de Impuestos Teórica','utilidadAntesImpuestos'),
        annual('(-) Impuesto a la Renta','impuesto',true),
        annual('Utilidad Operativa Neta (NOPAT)','nopat'),
        annual('(+) Depreciación','depreciacion'),
        annual('(+) Amortización de Diferidos','amortizacion'),
        annual('(+) Valor de Desecho Contable','valorDesecho',false,true),
        ['(-) Inversión Inicial',money(-M.inversion.total),...Array(M.fce.flows.length-1).fill('')],
        ['FLUJO DE CAJA LIBRE (FCL)',...M.fce.flows.map(money)]
      ];
      return sheetHeader(title,'Flujo de caja del proyecto, sin financiamiento (descontado al WACC). Incluye valor de desecho en el año 5.', id) + kpiRow(sheetKpis(id, M)) + `
      <div class="card"><h3>Flujo de Caja sin Financiamiento (Actualizado con Valor de Desecho)</h3>${tbl(heads, rows, {totalRow:9})}</div>
      <div class="card"><h3>Flujo de Caja Económico</h3><div class="chart-box"><canvas id="chFCE"></canvas></div></div>`;
    }

    case 'fcf': {
      const heads=[{label:'Concepto'}, ...Array.from({length:M.fcf.flows.length},(_,i)=>({label:'Año '+i,num:true}))];
      const annual=(label,key,negative=false,blankZero=false)=>[label,'',...M.fcf.detalle.map(r=>blankZero&&r[key]===0?'':money(negative?-r[key]:r[key]))];
      const rows=[
        annual('UTILIDAD NETA','utilidadNeta'),
        annual('(+) Depreciación','depreciacion'),
        annual('(+) Amortización de Diferidos','amortizacion'),
        annual('(-) Amortización de Deuda (Capital)','amortizacionCapital',true),
        annual('(+) Valor de Desecho Contable','valorDesecho',false,true),
        ['(-) Inversión de los Socios (Aporte)',money(-M.inversion.aporteSocios),...Array(M.fcf.flows.length-1).fill('')],
        ['FLUJO DEL INVERSIONISTA (FCI)',...M.fcf.flows.map(money)]
      ];
      return sheetHeader(title,'Flujo del inversionista con financiamiento, descontado al Ke. Parte de la utilidad neta (incluye intereses), suma depreciación y amortización, resta el capital pagado del préstamo y agrega el valor de desecho en el año 5.', id) + kpiRow(sheetKpis(id, M)) + `
      <div class="card"><h3>Flujo de Caja del Inversionista (Financiero)</h3>${tbl(heads, rows, {totalRow:6})}<p class="muted">Los intereses del préstamo ya están considerados en la utilidad neta; esta tabla resta únicamente la amortización de capital.</p></div>
      <div class="card"><h3>Flujo de Caja del Inversionista</h3><div class="chart-box"><canvas id="chFCF"></canvas></div></div>`;
    }

    case 'vantir': {
      const rows = [['VAN', money(M.fce.van), money(M.fcf.van)],['TIR', isFinite(M.fce.tir)?pct(M.fce.tir):'N/D', isFinite(M.fcf.tir)?pct(M.fcf.tir):'N/D'],['Tasa de Descuento', pct(M.fce.tasa), pct(M.fcf.tasa)],['Veredicto', M.fce.van>0?'Viable':'No viable', M.fcf.van>0?'Viable':'No viable']];
      return sheetHeader(title,'Comparación entre el flujo económico (sin financiamiento) y el financiero (con financiamiento, desde la óptica del inversionista).', id) + kpiRow(sheetKpis(id, M)) + `<div class="two-col"><div class="card">${tbl([{label:'Indicador'},{label:'Económico (Proyecto)',num:true},{label:'Financiero (Inversionista)',num:true}], rows)}</div><div class="card"><h3>VAN comparado</h3><div class="chart-box sm"><canvas id="chVanTir"></canvas></div></div></div>`;
    }

    case 'payback': {
      const paybackTable=(flows)=>{
        let acumulado=0;
        const periodos=flows.map((flujo,anio)=>{ acumulado+=flujo; return {anio,flujo,acumulado,recuperado:acumulado>=0}; });
        const heads=[{label:'Concepto'},...periodos.map(p=>({label:'Año '+p.anio,num:true}))];
        const row=(label,values)=>[label,...values];
        return tbl(heads,[row('Flujo Neto del Período',periodos.map(p=>money(p.flujo))),row('Flujo Acumulado',periodos.map(p=>money(p.acumulado))),row('Estado de Recuperación',periodos.map(p=>p.recuperado?'Recuperado':'Pendiente'))]);
      };
      return sheetHeader(title,'Payback nominal calculado acumulando los flujos sin descuento hasta recuperar el aporte inicial. El año de recuperación se interpola según la fracción del flujo de ese período.', id) + kpiRow(sheetKpis(id, M)) + `
      <div class="card"><h3>Payback Económico (sin financiamiento)</h3>${paybackTable(M.fce.flows)}<p class="muted">Inversión inicial: ${money(M.inversion.total)} · Recuperación estimada: ${isFinite(M.payback.economico)?fmt(M.payback.economico,2)+' años':'No se recupera dentro del horizonte'}.</p></div>
      <div class="card"><h3>Payback del Inversionista (con financiamiento)</h3>${paybackTable(M.fcf.flows)}<p class="muted">Aporte inicial de socios: ${money(M.inversion.aporteSocios)} · Recuperación estimada: ${isFinite(M.payback.financiero)?fmt(M.payback.financiero,2)+' años':'No se recupera dentro del horizonte'}.</p></div>
      <div class="two-col"><div class="card"><h3>Acumulado económico</h3><div class="chart-box sm"><canvas id="chPayback"></canvas></div></div><div class="card"><h3>Acumulado del inversionista</h3><div class="chart-box sm"><canvas id="chPaybackFCF"></canvas></div></div></div>`;
    }

    case 'indic': {
      const heads = [{label:'Indicador'}].concat(M.indicadores.map(r=>({label:'Año '+r.anio,num:true})));
      const line=(label,key)=>[label, ...M.indicadores.map(r=>pct(r[key]))];
      const rows = [line('Margen Bruto','margenBruto'), line('Margen Operativo','margenOperativo'), line('Margen Neto','margenNeto'), line('ROE','roe'), line('ROA','roa'), line('Endeudamiento','endeudamiento')];
      return sheetHeader(title,'Indicadores clave de rentabilidad y solidez financiera, año a año.', id) + kpiRow(sheetKpis(id, M)) + `<div class="card">${tbl(heads, rows)}</div><div class="card"><h3>Márgenes de rentabilidad</h3><div class="chart-box"><canvas id="chIndic"></canvas></div></div>`;
    }

    case 'sens': {
      const escenarios=M.escenariosSensibilidad||[];
      const indicator=v=>isFinite(v)?money(v):'N/D', rate=v=>isFinite(v)?pct(v):'N/D', pb=v=>isFinite(v)?fmt(v,2)+' años':'No recupera';
      const rows=escenarios.map(s=>s.activo?[s.nombre,pct(s.variacion),indicator(s.modelo.fce.van),rate(s.modelo.fce.tir),pb(s.modelo.payback.economico),indicator(s.modelo.fcf.van),rate(s.modelo.fcf.tir),pb(s.modelo.payback.financiero)]:[s.nombre,'Pendiente','N/D','N/D','N/D','N/D','N/D','N/D']);
      const heads=[{label:'Escenario'},{label:'Variación',num:true},{label:'VAN Económico',num:true},{label:'TIR Económica',num:true},{label:'Payback Económico'},{label:'VAN Financiero',num:true},{label:'TIR Financiera',num:true},{label:'Payback Financiero'}];
      const flowHeads=[{label:'Flujo'},...Array.from({length:6},(_,i)=>({label:'Año '+i,num:true}))];
      const details=escenarios.map((s,i)=>{
        if(!s.activo) return `<div class="card"><h3>Escenario 3: define otra variación</h3><p class="muted">Ingresa una variación en Variables → Crecimiento e Inflación para calcular sus flujos.</p></div>`;
        const fm=s.modelo;
        const flowRows=[['Flujo Económico (FCE)',...fm.fce.flows.map(money)],['Flujo del Inversionista (FCI)',...fm.fcf.flows.map(money)]];
        const explanationRows=[
          ['Flujo Económico (FCE)','Año 0: inversión total inicial. Años 1 a 5: EBIT menos participación de trabajadores e impuesto calculado sobre EBIT, más depreciación y amortización; se suma el valor de desecho en el año 5.'],
          ['Flujo del Inversionista (FCI)','Año 0: aporte de los socios. Años 1 a 5: utilidad neta más depreciación y amortización, menos abono de capital del préstamo; se suma el valor de desecho en el año 5. Los intereses ya están dentro de la utilidad neta.']
        ];
        return `<div class="card"><h3>${s.nombre} (${pct(s.variacion)})</h3>${tbl(flowHeads,flowRows)}<h4>Explicación de los flujos</h4>${tbl([{label:'Flujo'},{label:'Cálculo aplicado'}],explanationRows)}<p class="muted">La disminución se aplica directamente a las ventas de cada año, incluido el año 1. Se mantienen constantes la inversión inicial, los costos proyectados y las condiciones del préstamo para aislar el efecto de vender menos; los resultados, impuestos, flujos, VAN, TIR y payback se recalculan.</p></div>`;
      }).join('');
      return sheetHeader(title,'Tres escenarios de disminución directa de ventas: 5%, 10% y un porcentaje personalizado. Cada escenario recalcula los estados de resultados, flujos económicos y del inversionista, VAN, TIR y payback.', id) + kpiRow(sheetKpis(id, M)) + `<div class="card"><h3>Resumen de escenarios</h3>${tbl(heads,rows)}</div>${details}<div class="card"><h3>Comparación del VAN por escenario</h3><div class="chart-box"><canvas id="chSens"></canvas></div></div>`;
    }

    case 'resultados': {
      const decision=(van,tir,tasa)=>van>0&&isFinite(tir)&&tir>tasa?'APROBABLE':'NO APROBABLE';
      const decE=decision(M.fce.van,M.fce.tir,M.fce.tasa), decF=decision(M.fcf.van,M.fcf.tir,M.fcf.tasa);
      const aprobado=decE==='APROBABLE'&&decF==='APROBABLE';
      const resultadoRows=[
        ['Económica (sin financiamiento)','FCE',money(M.fce.van),pct(M.fce.tasa),isFinite(M.fce.tir)?pct(M.fce.tir):'N/D',isFinite(M.paybackDescontado.economico)?fmt(M.paybackDescontado.economico,2)+' años':'No recupera',decE],
        ['Financiera (inversionista)','FCI',money(M.fcf.van),pct(M.fcf.tasa),isFinite(M.fcf.tir)?pct(M.fcf.tir):'N/D',isFinite(M.paybackDescontado.financiero)?fmt(M.paybackDescontado.financiero,2)+' años':'No recupera',decF]
      ];
      const escRows=(M.escenariosSensibilidad||[]).map(s=>{
        if(!s.activo)return[s.nombre,'Pendiente','Pendiente','Pendiente','Pendiente','Pendiente'];
        const me=s.modelo, de=decision(me.fce.van,me.fce.tir,me.fce.tasa), df=decision(me.fcf.van,me.fcf.tir,me.fcf.tasa);
        return[s.nombre,pct(s.variacion),money(me.fce.van),de,money(me.fcf.van),df];
      });
      const sens10=(M.escenariosSensibilidad||[]).find(s=>s.nombre==='Disminución del 10%'&&s.activo);
      const sens10Neg=sens10&&(sens10.modelo.fce.van<=0||sens10.modelo.fcf.van<=0);
      const sinDesechoEco=M.fce.van-M.desecho.total/Math.pow(1+M.fce.tasa,5);
      const sinDesechoFin=M.fcf.van-M.desecho.total/Math.pow(1+M.fcf.tasa,5);
      const dependenciaDesecho= M.fce.van>0&&sinDesechoEco<=0 || M.fcf.van>0&&sinDesechoFin<=0;
      const apalancamientoPositivo=isFinite(M.fcf.tir)&&isFinite(M.fce.tir)&&M.fcf.tir>M.fce.tir&&M.fcf.van>0;
      const aprobacionTexto=aprobado?'Con los supuestos actuales, el proyecto cumple los criterios económico y financiero: VAN positivo y TIR superior a su tasa mínima en ambas perspectivas.':'Con los supuestos actuales, el proyecto no cumple todos los criterios de aprobación. Se recomienda revisar la estructura de costos, ingresos o financiamiento antes de comprometer la inversión.';
      const recomendacion10=sens10Neg?`El escenario de disminución de ventas del 10% deja al menos uno de los VAN en cero o negativo (${sens10?`VAN económico ${money(sens10.modelo.fce.van)} y VAN del inversionista ${money(sens10.modelo.fcf.van)}`:''}). Bajo ese escenario no se recomienda aprobar; es crítico proteger las ventas y monitorear cualquier caída.`:'Con la disminución de ventas del 10%, los VAN permanecen positivos según los datos actuales. Aun así, se recomienda monitorear ventas y actualizar este análisis ante cualquier caída.';
      const salvageTexto=dependenciaDesecho?`La viabilidad depende del valor de desecho contable del año 5 (${money(M.desecho.total)}): al excluirlo, al menos uno de los VAN pasa a cero o negativo. Conviene cuidar y mantener los activos para sostener su valor residual.`:`El valor de desecho contable del año 5 considerado es ${money(M.desecho.total)}. Mantener los activos en buen estado contribuye a conservar el valor residual proyectado.`;
      return sheetHeader(title,'Lectura ejecutiva calculada con los datos vigentes del simulador y los escenarios de sensibilidad definidos.',id)+kpiRow(sheetKpis(id,M))+
        `<div class="card"><h3>Conclusión general</h3><p><strong>${aprobado?'RECOMENDACIÓN: APROBAR':'RECOMENDACIÓN: NO APROBAR SIN AJUSTES'}</strong> · ${aprobacionTexto}</p></div>
        <div class="card"><h3>A. Perspectiva económica (sin financiamiento)</h3><p><strong>Creación de valor:</strong> VAN económico de ${money(M.fce.van)} con WACC de ${pct(M.fce.tasa)}. ${M.fce.van>0?'El flujo económico crea valor al superar el costo de capital.':'El flujo económico no alcanza a cubrir el costo de capital y destruye valor en términos presentes.'}</p><p><strong>Rentabilidad operativa:</strong> TIR de ${isFinite(M.fce.tir)?pct(M.fce.tir):'N/D'} frente al WACC de ${pct(M.fce.tasa)}. ${decE==='APROBABLE'?'La rentabilidad operativa supera el mínimo exigido.':'La rentabilidad operativa no supera el mínimo exigido o el VAN no es positivo.'}</p></div>
        <div class="card"><h3>B. Perspectiva financiera (con financiamiento / inversionista)</h3><p><strong>Estructura de financiamiento:</strong> ${pct(M.inversion.pctAjeno)} de la inversión (${money(M.inversion.montoPrestamo)}) se cubre con deuda y ${pct(M.inversion.pctPropio)} (${money(M.inversion.aporteSocios)}) con capital de socios. VAN financiero: ${money(M.fcf.van)}.</p><p><strong>Rendimiento del inversionista:</strong> TIR financiera de ${isFinite(M.fcf.tir)?pct(M.fcf.tir):'N/D'} comparada con Ke de ${pct(M.fcf.tasa)}. ${apalancamientoPositivo?'El apalancamiento mejora la TIR de los socios frente a la rentabilidad económica y el VAN financiero es positivo.':'Con los datos actuales no se confirma un apalancamiento positivo que mejore la rentabilidad de los socios.'}</p></div>
        <div class="card"><h3>C. Recuperación del capital (payback descontado)</h3><p>Al descontar cada flujo a su tasa correspondiente, el período estimado de recuperación es de <strong>${isFinite(M.paybackDescontado.economico)?fmt(M.paybackDescontado.economico,2)+' años':'más de 5 años / no recuperado'}</strong> para el proyecto económico (WACC) y <strong>${isFinite(M.paybackDescontado.financiero)?fmt(M.paybackDescontado.financiero,2)+' años':'más de 5 años / no recuperado'}</strong> para el aporte del inversionista (Ke). ${(!isFinite(M.paybackDescontado.economico)||!isFinite(M.paybackDescontado.financiero))?'El capital no se recupera a valor presente dentro del horizonte de evaluación.':'La recuperación se alcanza dentro del horizonte de evaluación.'}</p></div>
        <div class="card"><h3>Evaluación de los escenarios de disminución de ventas</h3>${tbl([{label:'Escenario'},{label:'Disminución',num:true},{label:'VAN Económico',num:true},{label:'Decisión económica'},{label:'VAN Inversionista',num:true},{label:'Decisión financiera'}],escRows)}<p><strong>${recomendacion10}</strong></p></div>
        <div class="card"><h3>Conclusiones y recomendaciones estratégicas</h3><ol><li>${aprobacionTexto}</li><li>${salvageTexto}</li><li>${recomendacion10}</li><li>Monitorear mensualmente las ventas frente al plan y activar medidas comerciales antes de alcanzar una disminución del 10%; volver a evaluar VAN y TIR si cambian los supuestos.</li></ol></div>`;
    }

    case 'cronograma': {
      const items = M.cronograma.items;
      const fmtEs = (iso)=> iso? new Date(iso+'T00:00:00').toLocaleDateString('es-EC',{year:'numeric',month:'short',day:'2-digit'}) : 'N/D';
      const rows = items.map(a=>[a.nombre, fmtEs(a.fechaInicio), fmtEs(a.fechaFinal), isFinite(daysBetween(a.fechaInicio,a.fechaFinal))? daysBetween(a.fechaInicio,a.fechaFinal):'N/D']);
      return sheetHeader(title,`Actividades previas al arranque de operaciones. Del ${fmtEs(M.cronograma.fechaInicioProyecto)} al ${fmtEs(M.cronograma.fechaFinProyecto)} — ${M.cronograma.totalDias} días en total.`, id) + kpiRow(sheetKpis(id, M)) + `<div class="card">${tbl([{label:'Actividad'},{label:'Fecha de Inicio'},{label:'Fecha Final'},{label:'Duración (días)',num:true}], rows)}</div><div class="card"><h3>Cronograma (Gantt)</h3><div class="chart-box"><canvas id="chCronograma"></canvas></div></div>`;
    }

    default: return `<div class="card">Pestaña no encontrada.</div>`;
  }
}

/* ---------- 13. EXPORTACIÓN ---------- */
function sheetToRowsForExport(id, M){
  const meta = SHEETS.find(s=>s.id===id); const title = meta? meta.nombre : id;
  const container = document.querySelector('#content');
  const tables = []; let lastCaption = '';
  Array.from(container.querySelectorAll('h3, h4, table')).forEach(el=>{
    if (el.tagName==='H3' || el.tagName==='H4'){ lastCaption = el.textContent.trim(); }
    else if (el.tagName==='TABLE'){
      const headers = Array.from(el.querySelectorAll('thead th')).map(th=>th.textContent.trim());
      const rows = Array.from(el.querySelectorAll('tbody tr')).map(tr=> Array.from(tr.querySelectorAll('td')).map(td=>td.textContent.trim()));
      tables.push({caption:lastCaption, headers, rows});
    }
  });
  return {title, tables};
}
function exportSheetXlsx(id, M){
  const data = sheetToRowsForExport(id, M);
  const wb = XLSX.utils.book_new(); const used = {};
  data.tables.forEach((t,i)=>{
    const aoa = [[data.title],[t.caption||''],[],t.headers, ...t.rows];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    let name = (t.caption||('Tabla'+(i+1))).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28) || 'Tabla'+(i+1);
    if (used[name]){ used[name]++; name = (name+'_'+used[name]).slice(0,31); } else used[name]=1;
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, `${id}_${data.title.replace(/\s+/g,'_')}.xlsx`);
}
function exportSheetWord(id, M){
  const data = sheetToRowsForExport(id, M);
  let html = `<h1>${data.title}</h1><p class="meta">Generado por Simulador Financiero — ${new Date().toLocaleDateString('es-EC')}</p>`;
  data.tables.forEach(t=>{
    if (t.caption) html += `<h2>${t.caption}</h2>`;
    html += `<table><thead><tr>${t.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
    t.rows.forEach(r=>{ html += `<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`; });
    html += `</tbody></table>`;
  });
  download(`${id}_${data.title.replace(/\s+/g,'_')}.doc`, htmlToWord(data.title, html));
}
function exportAllXlsx(M){
  const wb = XLSX.utils.book_new(); const originalPage = state.page; const used = {};
  SHEETS.forEach(s=>{
    state.page = s.id;
    document.getElementById('content').innerHTML = renderSheet(s.id, M);
    const data = sheetToRowsForExport(s.id, M);
    data.tables.forEach((t,i)=>{
      const aoa = [[data.title],[t.caption||''],[],t.headers, ...t.rows];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      let name = (s.id+'_'+(i+1)).slice(0,31);
      if (used[name]){ used[name]++; name=(name+used[name]).slice(0,31); } used[name]=(used[name]||0)+1;
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
  });
  state.page = originalPage; render();
  XLSX.writeFile(wb, `Simulador_Financiero_Completo.xlsx`);
}
function exportAllWord(M){
  let html = `<h1>Simulador Financiero — Reporte Completo</h1><p class="meta">Usuario: ${state.user} · Generado ${new Date().toLocaleDateString('es-EC')}</p>`;

function baseOpts(extra={}){
  return Object.assign({ responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{labels:{color:CC.muted, font:{family:'Inter',size:11}}}, tooltip:{titleFont:{family:'Inter'},bodyFont:{family:'Inter'}} },
    scales:{ x:{grid:{display:false}, ticks:{color:CC.muted, font:{family:'IBM Plex Mono',size:10.5}}}, y:{grid:{color:CC.grid}, ticks:{color:CC.muted, font:{family:'IBM Plex Mono',size:10.5}}} }

function baseOptsDark(extra={}){

}
function mkChart(id, cfg){
  const el=document.getElementById(id); if(!el) return;
  if (typeof Chart === 'undefined'){
    const box = el.closest('.chart-box'); if (box) box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:12px;text-align:center;padding:10px;">⚠ No se pudo cargar la librería de gráficos (Chart.js). Revisa tu conexión a internet y recarga la página.</div>';
    return;
  }
  try{ charts[id]=new Chart(el, cfg); }
  catch(e){ console.error('Error creando gráfico', id, e); const box = el.closest('.chart-box'); if (box) box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:12px;">⚠ No se pudo generar este gráfico.</div>'; }

function getPath(obj, path){ return path.split('.').reduce((o,k)=>o&&o[k],obj); }
function setPath(obj, path, val){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=val; }
async function persist(){
  if(state.isReadOnly){state.saveStatus='readonly';return false;}
  state.saveStatus='saving';const label=document.getElementById('saveStatusLabel');if(label)label.textContent='Guardando…';
  try{if(state.profileRole==='user'){if(state.isDirectClient)await DB.saveDirectProgress(state.vars);else{if(!state.courseId)throw new Error('Selecciona primero un curso.');await DB.saveCourseProgress(state.courseId,state.vars);}}else await DB.setScenario(state.user,state.vars);state.saveStatus='saved';if(label)label.textContent='Cambios guardados';return true;}
  catch(e){state.saveStatus='error';if(label)label.textContent='Error al guardar. Revisa tu conexión.';return false;}
}
