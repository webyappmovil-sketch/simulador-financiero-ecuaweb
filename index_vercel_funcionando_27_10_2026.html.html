<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================================
   SIMULADOR FINANCIERO — FASE 2
========================================================================= */

/* ---------- 0. UTILIDADES ---------- */
const fmt = (n, d=2) => (n===null||n===undefined||isNaN(n)) ? '—' : n.toLocaleString('es-EC',{minimumFractionDigits:d,maximumFractionDigits:d});
const money = (n) => (n<0?'-$':'$') + fmt(Math.abs(n));
const pct = (n,d=2) => (isNaN(n)?'—':(n*100).toLocaleString('es-EC',{minimumFractionDigits:d,maximumFractionDigits:d})+'%');
const clamp01 = (x)=>Math.max(0,Math.min(1,x));
async function sha256(msg){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function npv(rate, flows){ let v=0; flows.forEach((cf,i)=>{ v += cf/Math.pow(1+rate, i+1); }); return v; }
function irr(allFlows, guess=0.12){
  function f(rate){ let v=0; allFlows.forEach((cf,i)=>{ v+=cf/Math.pow(1+rate,i); }); return v; }
  const scale = Math.max(1, ...allFlows.map(v=>Math.abs(v)));
  let r = guess;
  for(let i=0;i<80;i++){
    const h=1e-6, y=f(r), dy=(f(r+h)-f(r-h))/(2*h);
    if (Math.abs(dy) < 1e-9) break;
    const rn = r - y/dy;
    if (!isFinite(rn)) break;
    if (Math.abs(rn-r) < 1e-9) { r = rn; break; }
    r = rn;
  }
  const valid = (rr) => isFinite(rr) && rr > -0.999 && Math.abs(f(rr))/scale < 1e-4;
  if (valid(r)) return r;
  const steps=400, lo0=-0.99, hi0=10;
  let prevRate=lo0, prevVal=f(lo0);
  for(let i=1;i<=steps;i++){
    const rate = lo0+(hi0-lo0)*i/steps, val=f(rate);
    if (prevVal===0) return prevRate;
    if (prevVal*val<0){
      let lo=prevRate, hi=rate, flo=prevVal;
      for(let k=0;k<100;k++){ const mid=(lo+hi)/2, fm=f(mid); if (Math.abs(fm)/scale<1e-6) return mid; if (flo*fm<0){hi=mid;} else {lo=mid;flo=fm;} }
      return (lo+hi)/2;
    }
    prevRate=rate; prevVal=val;
  }
  return NaN;
}
function amortFrances(principal, rateAnnual, years){
  const rows=[]; if (years<=0||principal<=0) return rows;
  const cuota = rateAnnual===0 ? principal/years : principal*rateAnnual/(1-Math.pow(1+rateAnnual,-years));
  let saldo = principal;
  for(let t=1;t<=years;t++){
    const interes = saldo*rateAnnual; let capital = cuota-interes;
    if (t===years) capital = saldo;
    saldo = Math.max(0, saldo-capital);
    rows.push({anio:t, cuota:capital+interes, interes, capital, saldo});
  }
  return rows;
}
function paybackDe(flows){
  let acc = flows[0]; if (acc>=0) return 0;
  for(let i=1;i<flows.length;i++){ const prev=acc; acc+=flows[i]; if (acc>=0){ const frac = flows[i]!==0? (-prev)/flows[i]:0; return (i-1)+frac; } }
  return NaN;
}
function paybackDescontadoDe(flows, rate){
  let acumulado=flows[0]||0; if(acumulado>=0) return 0;
  for(let i=1;i<flows.length;i++){
    const flujoDescontado=flows[i]/Math.pow(1+rate,i), previo=acumulado;
    acumulado+=flujoDescontado;
    if(acumulado>=0&&flujoDescontado>0) return (i-1)+(-previo/flujoDescontado);
  }
  return NaN;
}

  V.areas={admin:0,ventas:0,planta:0,valorAlquilerMensual:0}; V.cifItems=[];

function isLegacySampleProject(vars){
  if(!vars||typeof vars!=='object') return false;
  const sortClean=(value,key='')=>{
    if(key==='cronograma'&&value&&Array.isArray(value.items)){
      const items=value.items, starts=items.map(it=>it.fechaInicio).filter(Boolean), first=starts.length?starts.reduce((a,b)=>a<b?a:b):'';
      return {items:items.map(it=>({nombre:it.nombre||'',inicioRelativo:first&&it.fechaInicio?daysBetween(first,it.fechaInicio):null,duracion:it.fechaInicio&&it.fechaFinal?daysBetween(it.fechaInicio,it.fechaFinal):null}))};
    }
    if(Array.isArray(value)) return value.map(item=>sortClean(item));
    if(value&&typeof value==='object') return Object.keys(value).sort().reduce((out,k)=>{out[k]=sortClean(value[k],k);return out;},{});
    return value;
  };
  return JSON.stringify(sortClean(vars))===JSON.stringify(sortClean(defaultVars()));
}
function fmtDateISO(d){ return d.toISOString().slice(0,10); }
function addDays(base, days){ const d=new Date(base); d.setDate(d.getDate()+days); return d; }

function daysBetween(d1, d2){
  if (!d1 || !d2) return NaN;
  const a = new Date(d1+'T00:00:00'), b = new Date(d2+'T00:00:00');
  if (isNaN(a)||isNaN(b)) return NaN;
  return Math.round((b-a)/86400000);
}
function mergeDefaults(loaded){

}

/* ---------- 3. MOTOR DE CÁLCULO ---------- */
function computeModel(V, skipSensitivity){
  const M = {}; const N_ANIOS = 5;

  // 1. Activos fijos y depreciación (lista única de activos + vida útil editable por categoría)
  const catKeys = ['muebles','computo','maquinaria','vehiculos','instalaciones','repuestos'];
  const catNombres = {muebles:'Muebles y Enseres', computo:'Equipo de Cómputo', maquinaria:'Maquinaria y Equipo', vehiculos:'Vehículos', instalaciones:'Instalaciones', repuestos:'Repuestos y Herramientas'};
  const DEPTOS_VALIDOS = ['Administracion','Ventas','Planta'];
  function sanitizeCategoria(c){
    if (catKeys.includes(c)) return c;
    const found = catKeys.find(k=>k.toLowerCase()===String(c||'').toLowerCase());
    return found || 'muebles';
  }
  function sanitizeDepto(d){
    if (DEPTOS_VALIDOS.includes(d)) return d;
    const found = DEPTOS_VALIDOS.find(k=>k.toLowerCase()===String(d||'').toLowerCase());
    return found || 'Administracion';
  }
  const vidaUtilMap = V.activos.vidaUtil || {};
  let depPorDepto={Administracion:0, Ventas:0, Planta:0};
  const activoItems = (V.activos.items||[]).map(it=>{
    const categoria = sanitizeCategoria(it.categoria);
    const depto = sanitizeDepto(it.depto);
    const total=(Number(it.cantidad)||0)*(Number(it.costo)||0);
    const vidaUtil = Number(vidaUtilMap[categoria])||10;
    const depAnual = total*(1-(Number(V.activos.valorResidualPct)||0))/vidaUtil;
    depPorDepto[depto] = (depPorDepto[depto]||0)+depAnual;
    return {...it, categoria, depto, total, vidaUtil, depAnual, categoriaNombre: catNombres[categoria]||categoria};
  });
  const totalActivosFijos = activoItems.reduce((s,i)=>s+i.total,0);
  const depAnualTotal = activoItems.reduce((s,i)=>s+i.depAnual,0);
  const depreciacionActivosAnio = anio=>activoItems.reduce((s,i)=>s+(anio<=i.vidaUtil?i.depAnual:0),0);
  const depreciacionDeptoAnio = (depto,anio)=>activoItems.reduce((s,i)=>s+(i.depto===depto&&anio<=i.vidaUtil?i.depAnual:0),0);
  const categorias = catKeys.map(k=>{
    const catItems = activoItems.filter(i=>i.categoria===k);
    return {key:k, nombre:catNombres[k], vidaUtil:Number(vidaUtilMap[k])||10, items:catItems, total:catItems.reduce((s,i)=>s+i.total,0), depAnual:catItems.reduce((s,i)=>s+i.depAnual,0)};
  });
  M.activos = { items:activoItems, categorias, totalActivosFijos, depAnualTotal, depPorDepto, depreciacionActivosAnio, depreciacionDeptoAnio, valorResidualPct:V.activos.valorResidualPct, vidaUtil:vidaUtilMap };

  // 2. Diferidos
  const diferidosItems=(V.diferidos.items||[]).map(it=>({...it, total:(Number(it.cantidad)||0)*(Number(it.costo)||0)}));
  const totalDiferidos = diferidosItems.reduce((s,i)=>s+i.total,0);
  const aniosAmort = Number(V.diferidos.aniosAmortizacion)||5;
  const amortAnual=aniosAmort>0? totalDiferidos/aniosAmort:0;
  M.diferidos = { items:diferidosItems, total:totalDiferidos, amortAnual, aniosAmort, amortizacionAnio:anio=>anio<=aniosAmort?amortAnual:0 };

  // 3. Producción / capacidad
  const P = V.produccion;
  const minutosHora = 60; // fijo: una hora siempre tiene 60 minutos
  const unidadesHoraTrabajador = (Number(P.factorUnitario)||0)*minutosHora/(Number(P.tiempoPrepMin)||1);
  const unidadesDiaPorTrabajador = unidadesHoraTrabajador*(Number(P.horasDiarias)||0);
  const unidadesMesPorTrabajador = unidadesDiaPorTrabajador*(Number(P.diasMes)||0);
  const capacidadDiaria = unidadesDiaPorTrabajador; // producción mensual instalada = solo unidades por mes (no se multiplica por N° de operarios)
  const capacidadMensual = unidadesMesPorTrabajador;
  const produccionMensual = capacidadMensual*(Number(P.pctUtilizacion)||0);
  M.produccion = {...P, minutosHora, unidadesHoraTrabajador, unidadesDiaPorTrabajador, unidadesMesPorTrabajador, capacidadDiaria, capacidadMensual, produccionMensual};

  // 4. Materia prima (costo por porción, con conversión de unidad, × unidades a producir) / materiales indirectos (cantidad directa) / inventarios de suministros
  function factorConversion(porcionTipo){ return (porcionTipo==='gramos'||porcionTipo==='mililitros') ? 1000 : 1; }
  const mp = (V.materiaPrima.items||[]).map(it=>{
    const costo=Number(it.costo)||0, porcion=Number(it.porcion)||0;
    const factor = factorConversion(it.porcionTipo);
    const costoPorPorcion = costo*(porcion/factor);
    const total = costoPorPorcion*produccionMensual;
    return {...it, costoPorPorcion, unidadesAProducir:produccionMensual, total};
  });
  const totalMP = mp.reduce((s,i)=>s+i.total,0);
  const mi = (V.materialesIndirectos.items||[]).map(it=>{
    const cantidad=Number(it.cantidad)||0, costo=Number(it.costo)||0;
    return {...it, total: cantidad*costo};
  });
  const totalMI = mi.reduce((s,i)=>s+i.total,0);
  const so = (V.suministrosOficina.items||[]).map(it=>({...it, total:(Number(it.cantidad)||0)*(Number(it.costo)||0)}));
  const totalSO = so.reduce((s,i)=>s+i.total,0);
  const sl = (V.suministrosLimpieza.items||[]).map(it=>({...it, total:(Number(it.cantidad)||0)*(Number(it.costo)||0)}));
  const totalSL = sl.reduce((s,i)=>s+i.total,0);
  M.materiaPrima = {items:mp, total:totalMP, costoUnitario: produccionMensual>0? totalMP/produccionMensual:0};
  M.materialesIndirectos = {items:mi, total:totalMI};
  M.suministrosOficina = {items:so, total:totalSO};
  M.suministrosLimpieza = {items:sl, total:totalSL};

  // 5. Personal / Rol de pagos
  const FUNCIONES_VALIDAS = ['Administracion','Ventas','MOI','MOD'];
  function sanitizeFuncion(f){
    if (FUNCIONES_VALIDAS.includes(f)) return f;
    const found = FUNCIONES_VALIDAS.find(k=>k.toLowerCase()===String(f||'').toLowerCase());
    return found || 'Administracion';
  }
  const salMin = Number(V.personal.salarioMinimo)||0;
  const pctIessPersonal = Number(V.personal.pctIessPersonal)||0;
  const empleados = (V.personal.empleados||[]).map(e=>{
    const rem=Number(e.remuneracion)||0, puestos=Number(e.puestos)||0;
    const funcion = sanitizeFuncion(e.funcion);
    const iessPersonal = rem*pctIessPersonal;
    const netoPorPuesto = rem-iessPersonal;
    const decimoTercero = rem/12, decimoCuarto = salMin/12, vacaciones = rem/24;
    const fondoReserva = rem*(Number(V.personal.pctFondoReserva)||0);
    const iessPatronal = rem*(Number(V.personal.pctIessPatronal)||0);
    const totalProvisionesPorPuesto = decimoTercero+decimoCuarto+vacaciones+fondoReserva+iessPatronal;
    const totalUnit = rem+totalProvisionesPorPuesto;
    return {...e, funcion, iessPersonal, netoPorPuesto, netoTotal:netoPorPuesto*puestos, decimoTercero, decimoCuarto, vacaciones, fondoReserva, iessPatronal, totalProvisionesPorPuesto, totalProvisionesGrupo:totalProvisionesPorPuesto*puestos, totalUnit, totalMensual: totalUnit*puestos};
  });
  const porFuncion = {Administracion:0, Ventas:0, MOI:0, MOD:0};
  const puestosPorFuncion = {Administracion:0, Ventas:0, MOI:0, MOD:0};
  empleados.forEach(e=>{ porFuncion[e.funcion]=(porFuncion[e.funcion]||0)+e.totalMensual; puestosPorFuncion[e.funcion]=(puestosPorFuncion[e.funcion]||0)+(Number(e.puestos)||0); });
  const totalPersonalMensual = Object.values(porFuncion).reduce((a,b)=>a+b,0);
  M.personal = { empleados, porFuncion, puestosPorFuncion, totalMensual: totalPersonalMensual, pctIessPersonal, pctIessPatronal:V.personal.pctIessPatronal, pctFondoReserva:V.personal.pctFondoReserva, salarioMinimo:salMin };

  // 6. Áreas y CIF
  const A = V.areas;
  const areaTotal = (Number(A.admin)||0)+(Number(A.ventas)||0)+(Number(A.planta)||0);
  const valorM2 = areaTotal>0 ? (Number(A.valorAlquilerMensual)||0)/areaTotal : 0;
  const alquilerAdmin = valorM2*(Number(A.admin)||0), alquilerVentas = valorM2*(Number(A.ventas)||0), alquilerPlanta = valorM2*(Number(A.planta)||0);
  const pctAdmin = areaTotal>0? (Number(A.admin)||0)/areaTotal:0, pctVentas = areaTotal>0? (Number(A.ventas)||0)/areaTotal:0, pctPlanta = areaTotal>0? (Number(A.planta)||0)/areaTotal:0;
  const cifItems = (V.cifItems||[]).map(it=>{ const c=Number(it.costo)||0; return {...it, admin:c*pctAdmin, ventas:c*pctVentas, planta:c*pctPlanta}; });
  cifItems.unshift({nombre:'Alquiler', costo:Number(A.valorAlquilerMensual)||0, admin:alquilerAdmin, ventas:alquilerVentas, planta:alquilerPlanta});
  const cifAdmin = cifItems.reduce((s,i)=>s+i.admin,0), cifVentas = cifItems.reduce((s,i)=>s+i.ventas,0), cifPlanta = cifItems.reduce((s,i)=>s+i.planta,0);
  const depAdminMensual = M.activos.depPorDepto.Administracion/12, depVentasMensual = M.activos.depPorDepto.Ventas/12, depPlantaMensual = M.activos.depPorDepto.Planta/12;
  const cifAdminConDep = cifAdmin+depAdminMensual, cifVentasConDep = cifVentas+depVentasMensual, cifPlantaConDep = cifPlanta+depPlantaMensual;
  M.areas = {...A, areaTotal, valorM2, alquilerAdmin, alquilerVentas, alquilerPlanta, pctAdmin, pctVentas, pctPlanta};
  M.cif = {items:cifItems, cifAdmin, cifVentas, cifPlanta, cifAdminConDep, cifVentasConDep, cifPlantaConDep, depAdminMensual, depVentasMensual, depPlantaMensual, total: cifAdmin+cifVentas+cifPlanta, cifPlantaCompleto: cifPlantaConDep+totalMI+porFuncion.MOI, totalCompleto: cifAdminConDep+cifVentasConDep+cifPlantaConDep+totalMI+porFuncion.MOI};

  // 7. Financiamiento e inversión
  const F = V.financiamiento;
  const costoProdMensual = totalMP + porFuncion.MOD + totalMI + porFuncion.MOI + cifPlanta + depPlantaMensual;
  const costoUnitarioProduccion = produccionMensual>0 ? costoProdMensual/produccionMensual : 0;
  M.costeoProduccion = { materiaPrima:totalMP, manoObraDirecta:porFuncion.MOD, materialesIndirectos:totalMI, manoObraIndirecta:porFuncion.MOI, cifPlanta, depPlantaMensual, costoTotalMensual:costoProdMensual, costoUnitario:costoUnitarioProduccion };

  const gastosAdminMensual = porFuncion.Administracion+cifAdminConDep;
  const gastosVentasMensual = porFuncion.Ventas+cifVentasConDep;
  M.gastosAdminVentas = { sueldosAdmin:porFuncion.Administracion, cifAdmin:cifAdminConDep, depAdminMensual, totalAdmin:gastosAdminMensual, sueldosVentas:porFuncion.Ventas, cifVentas:cifVentasConDep, depVentasMensual, totalVentas:gastosVentasMensual, totalGeneral: gastosAdminMensual+gastosVentasMensual };

  const costosOperativosMensuales = costoProdMensual + porFuncion.Administracion + porFuncion.Ventas + cifAdminConDep + cifVentasConDep;
  const capitalTrabajo = costosOperativosMensuales*(Number(F.mesesCapitalTrabajo)||0);

  const inversionTotal = totalActivosFijos+totalDiferidos+capitalTrabajo;
  const pctPropio = clamp01(Number(F.pctCapitalPropio)||0);
  const aporteSocios = inversionTotal*pctPropio, montoPrestamo = inversionTotal*(1-pctPropio);
  M.inversion = { activosFijos:totalActivosFijos, diferidos:totalDiferidos, capitalTrabajo, total:inversionTotal, pctPropio, pctAjeno:1-pctPropio, aporteSocios, montoPrestamo };
  M.financiamiento = {...F};

  // 8. Amortización
  const amort = amortFrances(montoPrestamo, Number(F.tasaInteres)||0, Number(F.plazoAnios)||0);
  M.amortizacion = { rows:amort, principal:montoPrestamo, tasa:F.tasaInteres, plazo:F.plazoAnios };

  // 9. Precio de venta y punto de equilibrio
  const competenciaItems = (V.precioVenta.competencia||[]).map(c=>({empresa:c.empresa||'', precio:Number(c.precio)||0}));
  const competencia = competenciaItems.map(c=>c.precio);
  const promCompetencia = competencia.length? competencia.reduce((a,b)=>a+b,0)/competencia.length:0;
  const margen = Number(V.precioVenta.margen)||0;
  const pvu = costoUnitarioProduccion*(1+margen);
  M.precioVenta = { competencia, competenciaItems, promCompetencia, margen, costoUnitario:costoUnitarioProduccion, pvu };

  const cvu = costoUnitarioProduccion, mcu = pvu-cvu;
  const costosFijosMensualesPE = gastosAdminMensual + gastosVentasMensual + (amort[0]? amort[0].interes/12:0);
  const peUnidadesMensual = mcu>0 ? costosFijosMensualesPE/mcu : NaN;
  const peUnidadesAnual = peUnidadesMensual*12, peIngresosAnual = peUnidadesAnual*pvu;
  const chartPE=[]; const maxU = (isFinite(peUnidadesAnual)&&peUnidadesAnual>0? peUnidadesAnual*2:(produccionMensual*12*1.5||1000));
  for(let i=0;i<=10;i++){ const u=maxU*i/10; chartPE.push({u, costo: costosFijosMensualesPE*12+cvu*u, ingreso: pvu*u}); }
  M.puntoEquilibrio = { cvu, pvu, mcu, costosFijosMensuales:costosFijosMensualesPE, peUnidadesMensual, peUnidadesAnual, peIngresosAnual, chart:chartPE };

  // 10. Ingresos proyectados
  const tasa = Number(V.crecimiento.tasaCrecimientoVentas)||0, inflacion = Number(V.crecimiento.inflacionCostos)||0;
  M.crecimiento = {...V.crecimiento};
  const factorVentasSensibilidad=V._factorVentasSensibilidad===undefined?1:Math.max(0,Number(V._factorVentasSensibilidad)||0);
  let ingresos=[], unidadesBase = produccionMensual*12;
  for(let a=1;a<=N_ANIOS;a++){ const unidades = unidadesBase*Math.pow(1+tasa,a-1)*factorVentasSensibilidad; ingresos.push({anio:a, unidades, ingreso: unidades*pvu}); }
  M.ingresosProyectados = ingresos;

  // 11. Costos proyectados
  const costoVarAnualBase=(totalMP+totalMI)*12, modAnualBase=porFuncion.MOD*12, cifPlantaAnualBase=cifPlanta*12, moiAnualBase=porFuncion.MOI*12;
  const gastosAdminBase=(porFuncion.Administracion+cifAdmin)*12, gastosVentasBase=(porFuncion.Ventas+cifVentas)*12;
  let costosProyectados=[];
  for(let a=1;a<=N_ANIOS;a++){
    const factorInfl=Math.pow(1+inflacion,a-1);
    const depPlanta=M.activos.depreciacionDeptoAnio('Planta',a), depAdmin=M.activos.depreciacionDeptoAnio('Administracion',a), depVentas=M.activos.depreciacionDeptoAnio('Ventas',a);
    const depreciacion=depPlanta+depAdmin+depVentas, amortizacion=M.diferidos.amortizacionAnio(a);
    // Año 1 parte del costo mensual por 12; los costos y gastos operativos crecen solo por inflación.
    const costoProduccionBase=(costoVarAnualBase+modAnualBase+moiAnualBase+cifPlantaAnualBase)*factorInfl;
    const gastosAdminBaseAnual=gastosAdminBase*factorInfl, gastosVentasBaseAnual=gastosVentasBase*factorInfl;
    const costoProduccion=costoProduccionBase;
    const gastosAdmin=gastosAdminBaseAnual, gastosVentas=gastosVentasBaseAnual;
    const gastosFinancieros = amort[a-1]? amort[a-1].interes:0;
    costosProyectados.push({anio:a, costoProduccion, gastosAdmin, gastosVentas, depreciacion, depreciacionPlanta:depPlanta, depreciacionAdmin:depAdmin, depreciacionVentas:depVentas, amortizacion, gastosFinancieros, total:costoProduccion+gastosAdmin+gastosVentas+depreciacion+amortizacion+gastosFinancieros});
  }
  M.costosProyectados = costosProyectados;

  // 12. Estado de resultados
  const partEmp=Number(F.participacionEmpleados)||0, impRenta=Number(F.impuestoRenta)||0;
  let estadoResultados=[];
  for(let a=1;a<=N_ANIOS;a++){
    const costoAnual=costosProyectados[a-1];
    const ing=ingresos[a-1].ingreso, cp=costoAnual.costoProduccion, utilBruta=ing-cp;
    const gAdmin=costoAnual.gastosAdmin, gVentas=costoAnual.gastosVentas;
    const utilidadAntesDepAmort=utilBruta-gAdmin-gVentas;
    const depreciacion=costoAnual.depreciacion, amortizacion=costoAnual.amortizacion;
    const utilOperativa=utilidadAntesDepAmort-depreciacion-amortizacion;
    const gFin=costosProyectados[a-1].gastosFinancieros, utilAntesPart=utilOperativa-gFin;
    const participacion=Math.max(0,utilAntesPart)*partEmp, utilAntesImp=utilAntesPart-participacion;
    const impuesto=Math.max(0,utilAntesImp)*impRenta, utilNeta=utilAntesImp-impuesto;
    estadoResultados.push({anio:a, ingresos:ing, costoProduccion:cp, utilidadBruta:utilBruta, gastosAdmin:gAdmin, gastosVentas:gVentas, utilidadAntesDepAmort, depreciacion, amortizacion, utilidadOperativa:utilOperativa, gastosFinancieros:gFin, utilidadAntesPart:utilAntesPart, participacion, utilidadAntesImp:utilAntesImp, impuesto, utilidadNeta:utilNeta});
  }
  M.estadoResultados = estadoResultados;

  // 13. Balance general
  let balance=[]; let cajaPrev=capitalTrabajo, depAcum=0, difAcum=0, utilRetPrev=0;
  balance.push({anio:0, caja:capitalTrabajo, activoFijoNeto:totalActivosFijos, activoDiferidoNeto:totalDiferidos, totalActivo:capitalTrabajo+totalActivosFijos+totalDiferidos, prestamo:montoPrestamo, capitalSocial:aporteSocios, utilidadesRetenidas:0, totalPasivoPatrimonio:montoPrestamo+aporteSocios});
  for(let a=1;a<=N_ANIOS;a++){
    const dep=M.activos.depreciacionActivosAnio(a), amortDif=M.diferidos.amortizacionAnio(a), amortCap=amort[a-1]?amort[a-1].capital:0, un=estadoResultados[a-1].utilidadNeta;
    const caja=cajaPrev+un+dep+amortDif-amortCap; depAcum+=dep; difAcum+=amortDif;
    const activoFijoNeto=Math.max(0,totalActivosFijos-depAcum), activoDiferidoNeto=Math.max(0,totalDiferidos-difAcum);
    const totalActivo=caja+activoFijoNeto+activoDiferidoNeto, prestamoSaldo=amort[a-1]?amort[a-1].saldo:0, utilRet=utilRetPrev+un;
    const totalPasivoPatrimonio=prestamoSaldo+aporteSocios+utilRet;
    balance.push({anio:a, caja, activoFijoNeto, activoDiferidoNeto, totalActivo, prestamo:prestamoSaldo, capitalSocial:aporteSocios, utilidadesRetenidas:utilRet, totalPasivoPatrimonio});
    cajaPrev=caja; utilRetPrev=utilRet;
  }
  M.balance = balance;

  // 13.5 Valor de desecho (recuperación al final del horizonte)
  const bFinal = balance[N_ANIOS];
  const detalleActivosDesecho=M.activos.items.map(it=>{
    const aniosDepreciados=Array.from({length:N_ANIOS},(_,i)=>i+1).filter(anio=>anio<=it.vidaUtil).length;
    const depreciacionAcumulada=Math.min(it.depAnual*aniosDepreciados,it.total*(1-(Number(V.activos.valorResidualPct)||0)));
    return {...it, depreciacionAcumulada, valorEnLibros:Math.max(0,it.total-depreciacionAcumulada)};
  });
  const detalleCategoriasDesecho=M.activos.categorias.map(cat=>({nombre:cat.nombre, valor:detalleActivosDesecho.filter(it=>it.categoria===cat.key).reduce((s,it)=>s+it.valorEnLibros,0)}));
  const valorDesechoContable=detalleActivosDesecho.reduce((s,it)=>s+it.valorEnLibros,0);
  M.desecho = { detalleActivos:detalleActivosDesecho, detalleCategorias:detalleCategoriasDesecho, activoFijoNetoFinal:valorDesechoContable, activoDiferidoNetoFinal:bFinal.activoDiferidoNeto, capitalTrabajoRecuperado:capitalTrabajo, total:valorDesechoContable };

  // 14. Ke y WACC
  const OF=V.otrosFinancieros;
  const ke=(Number(OF.rf)||0)+(Number(OF.beta)||0)*(Number(OF.mrp)||0)+(Number(OF.riesgoPais)||0);
  M.ke = {...OF, ke};
  const ev=pctPropio, dv=1-pctPropio, rd=Number(F.tasaInteres)||0, ti=impRenta;
  const wacc = ev*ke+dv*rd*(1-ti);
  M.wacc = { ev, dv, ke, rd, ti, wacc };

  // 15. Flujos de caja (con valor de desecho en el último año) + VAN/TIR/Payback
  const fceDetalle=estadoResultados.map((r,i)=>{
    const participacion=Math.max(0,r.utilidadOperativa)*partEmp;
    const utilidadAntesImpuestos=r.utilidadOperativa-participacion;
    const impuesto=Math.max(0,utilidadAntesImpuestos)*impRenta;
    const nopat=utilidadAntesImpuestos-impuesto;
    const valorDesecho=i===N_ANIOS-1?M.desecho.total:0;
    return {anio:i+1, ebit:r.utilidadOperativa, participacion, utilidadAntesImpuestos, impuesto, nopat, depreciacion:r.depreciacion, amortizacion:r.amortizacion, valorDesecho, flujoLibre:nopat+r.depreciacion+r.amortizacion+valorDesecho};
  });
  const fceFlows=fceDetalle.map(r=>r.flujoLibre);
  const fceAll=[-inversionTotal, ...fceFlows];
  const vanFCE = npv(wacc, fceFlows)+fceAll[0], tirFCE = irr(fceAll);
  const fcfDetalle=estadoResultados.map((r,i)=>{
    const amortizacionCapital=amort[i]?amort[i].capital:0;
    const valorDesecho=i===N_ANIOS-1?M.desecho.total:0;
    const flujoInversionista=r.utilidadNeta+r.depreciacion+r.amortizacion-amortizacionCapital+valorDesecho;
    return {anio:i+1, utilidadNeta:r.utilidadNeta, depreciacion:r.depreciacion, amortizacion:r.amortizacion, amortizacionCapital, valorDesecho, flujoInversionista};
  });
  const fcfFlows=fcfDetalle.map(r=>r.flujoInversionista);
  const fcfAll=[-aporteSocios, ...fcfFlows];
  const vanFCF = npv(ke, fcfFlows)+fcfAll[0], tirFCF = irr(fcfAll);
  M.fce = { flows:fceAll, detalle:fceDetalle, van:vanFCE, tir:tirFCE, tasa:wacc };
  M.fcf = { flows:fcfAll, detalle:fcfDetalle, van:vanFCF, tir:tirFCF, tasa:ke };
  M.payback = { economico: paybackDe(fceAll), financiero: paybackDe(fcfAll) };
  M.paybackDescontado = { economico:paybackDescontadoDe(fceAll,wacc), financiero:paybackDescontadoDe(fcfAll,ke) };

  // 16. Indicadores financieros
  let indicadores=[];
  for(let a=1;a<=N_ANIOS;a++){
    const r=estadoResultados[a-1], b=balance[a];
    indicadores.push({ anio:a,
      margenBruto: r.ingresos? r.utilidadBruta/r.ingresos:NaN, margenOperativo: r.ingresos? r.utilidadOperativa/r.ingresos:NaN, margenNeto: r.ingresos? r.utilidadNeta/r.ingresos:NaN,
      roe: (b.capitalSocial+b.utilidadesRetenidas)? r.utilidadNeta/(b.capitalSocial+b.utilidadesRetenidas):NaN, roa: b.totalActivo? r.utilidadNeta/b.totalActivo:NaN, endeudamiento: b.totalActivo? b.prestamo/b.totalActivo:NaN });
  }
  M.indicadores = indicadores;

  // 17. Sensibilidad: tres escenarios configurables sobre crecimiento e inflación.
  if (!skipSensitivity){
    const definiciones=[
      {nombre:'Disminución del 5%',variacion:-Math.abs(Number(V.crecimiento.sensibilidadMenos5)||0)},
      {nombre:'Disminución del 10%',variacion:-Math.abs(Number(V.crecimiento.sensibilidadMenos10)||0)},
      {nombre:'Variación personalizada',variacion:V.crecimiento.sensibilidadPersonalizada===''||V.crecimiento.sensibilidadPersonalizada===null||V.crecimiento.sensibilidadPersonalizada===undefined?null:-Math.abs(Number(V.crecimiento.sensibilidadPersonalizada))}
    ];
    M.escenariosSensibilidad=definiciones.map(esc=>{
      if (esc.variacion===null||!Number.isFinite(esc.variacion)) return {...esc,activo:false, modelo:null};
      const V2=JSON.parse(JSON.stringify(V));
      V2._factorVentasSensibilidad=Math.max(0,1+esc.variacion);
      try{return {...esc,activo:true,modelo:computeModel(V2,true)};}catch(e){return {...esc,activo:false,modelo:null};}
    });
    M.sensibilidad=M.escenariosSensibilidad.filter(s=>s.activo).map(s=>({variable:s.nombre,variacion:s.variacion,van:s.modelo.fce.van,tir:s.modelo.fce.tir}));
  } else { M.sensibilidad=[]; M.escenariosSensibilidad=[]; }

  // 18. Cronograma: total de días = desde la fecha de inicio más temprana hasta la fecha final más tardía
  const cronoItems = (V.cronograma && V.cronograma.items) || [];
  const starts = cronoItems.map(a=>a.fechaInicio).filter(Boolean);
  const ends = cronoItems.map(a=>a.fechaFinal).filter(Boolean);
  let fechaInicioProyecto=null, fechaFinProyecto=null, totalDiasCrono=0;
  if (starts.length && ends.length){
    fechaInicioProyecto = starts.reduce((a,b)=> a<b?a:b);
    fechaFinProyecto = ends.reduce((a,b)=> a>b?a:b);
    totalDiasCrono = daysBetween(fechaInicioProyecto, fechaFinProyecto);
  }
  M.cronograma = { items: cronoItems, fechaInicioProyecto, fechaFinProyecto, totalDias: isFinite(totalDiasCrono)?totalDiasCrono:0 };

  return M;
}

function startAdminRegistrationWatch(){

}

function globalAnalysis(M){
  const viable = (M.fce.van>0) && (isFinite(M.fce.tir)? M.fce.tir>M.wacc.wacc : true);
  const margenSeg = (M.produccion.produccionMensual && isFinite(M.puntoEquilibrio.peUnidadesMensual)) ? (M.produccion.produccionMensual/M.puntoEquilibrio.peUnidadesMensual - 1) : NaN;
  const m1 = M.indicadores[0].margenNeto, m5 = M.indicadores[4].margenNeto;
  const roe1 = M.indicadores[0].roe, roe5 = M.indicadores[4].roe;
  const endeud1 = M.indicadores[0].endeudamiento, endeud5 = M.indicadores[4].endeudamiento;
  const byVar={}; M.sensibilidad.forEach(s=>{ (byVar[s.variable]=byVar[s.variable]||[]).push(s.van); });
  let maxRange=0, maxVar='';
  Object.entries(byVar).forEach(([k,vals])=>{ const vv=vals.filter(isFinite); if(!vv.length) return; const range=Math.max(...vv)-Math.min(...vv); if(range>maxRange){maxRange=range; maxVar=k;} });

  const conclusiones = [];
  const recomendaciones = [];

  conclusiones.push(viable
    ? `El proyecto es <strong>viable</strong>: la TIR económica ${isFinite(M.fce.tir)?pct(M.fce.tir):'N/D'} supera el WACC (${pct(M.wacc.wacc)}) y el VAN es positivo (${money(M.fce.van)}).`
    : `El proyecto <strong>no es viable</strong> con las variables actuales: el VAN económico es ${money(M.fce.van)}${isFinite(M.fce.tir)?` y la TIR (${pct(M.fce.tir)}) no supera el WACC (${pct(M.wacc.wacc)})`:''}.`);

  conclusiones.push(isFinite(margenSeg)
    ? (margenSeg>=0? `La producción planificada supera el punto de equilibrio en ${pct(margenSeg)}, lo que da un margen de seguridad operativo razonable.` : `La producción planificada está ${pct(Math.abs(margenSeg))} por debajo del punto de equilibrio: el negocio, tal como está configurado, no cubre sus costos fijos.`)
    : `No fue posible calcular el margen de seguridad frente al punto de equilibrio; revisa que el precio de venta supere el costo variable unitario.`);

  conclusiones.push(M.inversion.pctAjeno>0.6
    ? `La estructura de financiamiento depende fuertemente de deuda (${pct(M.inversion.pctAjeno)}), lo que incrementa el riesgo financiero.`
    : `La estructura de financiamiento está razonablemente equilibrada: ${pct(M.inversion.pctPropio)} capital propio y ${pct(M.inversion.pctAjeno)} préstamo.`);

  conclusiones.push(m5<m1
    ? `El margen neto se contrae de ${pct(m1)} (año 1) a ${pct(m5)} (año 5): los costos suben con la inflación mientras el precio de venta se mantiene fijo en el tiempo.`
    : `El margen neto mejora de ${pct(m1)} (año 1) a ${pct(m5)} (año 5): el crecimiento en ventas diluye los costos fijos más rápido de lo que suben los costos totales.`);

  conclusiones.push(isFinite(M.payback.economico)
    ? (M.payback.economico<=3? `El período de recuperación (${fmt(M.payback.economico,2)} años) es corto, lo que reduce el riesgo de la inversión.` : `El período de recuperación (${fmt(M.payback.economico,2)} años) es relativamente largo frente al horizonte de 5 años evaluado.`)
    : `La inversión no se recupera dentro del horizonte de 5 años proyectado — señal de alerta importante sobre la viabilidad en el mediano plazo.`);

  conclusiones.push(isFinite(endeud1)&&isFinite(endeud5)
    ? (endeud5<endeud1? `El nivel de endeudamiento baja de ${pct(endeud1)} a ${pct(endeud5)} en el horizonte, fortaleciendo la posición patrimonial de la empresa.` : `El nivel de endeudamiento se mantiene o aumenta en el horizonte — conviene monitorear la capacidad de pago.`)
    : `No se pudo evaluar la tendencia de endeudamiento por falta de datos suficientes.`);

  conclusiones.push(isFinite(roe1)&&isFinite(roe5)
    ? (roe5>roe1? `El retorno sobre el patrimonio (ROE) mejora de ${pct(roe1)} a ${pct(roe5)} — la rentabilidad para los socios aumenta con el tiempo.` : `El ROE se reduce de ${pct(roe1)} a ${pct(roe5)} — conviene identificar qué está presionando la utilidad neta.`)
    : `El ROE no pudo calcularse con precisión; verifica que el patrimonio proyectado no sea cero.`);

  if (maxVar) conclusiones.push(`La variable con mayor impacto sobre el VAN del proyecto es <strong>${maxVar}</strong> — pequeños cambios ahí mueven más el resultado que en cualquier otra variable analizada.`);

  conclusiones.push(`El valor de desecho al año 5 (${money(M.desecho.total)}) representa ${pct(M.inversion.total?M.desecho.total/M.inversion.total:0)} de la inversión inicial y mejora la rentabilidad total del proyecto al recuperarse al final del horizonte.`);

  conclusiones.push(`La inversión inicial total requerida es de ${money(M.inversion.total)}, de los cuales ${money(M.inversion.aporteSocios)} deben aportar los socios y ${money(M.inversion.montoPrestamo)} provendrían de financiamiento externo.`);

  // Recomendaciones
  if (!viable){
    recomendaciones.push(`Revisa al alza el margen de ganancia sobre el costo, las horas trabajadas al día o los días trabajados al mes para acercar la producción al punto de equilibrio.`);
    recomendaciones.push(`Evalúa reducir costos fijos (sueldos administrativos, CIF, alquiler) antes de comprometer la inversión.`);
  } else {
    recomendaciones.push(`Mantén un monitoreo periódico del punto de equilibrio: pequeñas caídas en ventas o subidas de costo pueden erosionar el margen de seguridad actual.`);
  }

  recomendaciones.push(m5<m1
    ? `Define una política de ajuste anual de precios (al menos acorde a la inflación) para evitar que el margen neto se siga erosionando año a año.`
    : `Aprovecha la mejora de margen proyectada para fortalecer capital de trabajo o acelerar el pago de deuda.`);

  recomendaciones.push(M.inversion.pctAjeno>0.6
    ? `Negocia condiciones de financiamiento más favorables (tasa o plazo) o busca aumentar el aporte propio para reducir el riesgo financiero.`
    : `Mantén la actual estructura de financiamiento equilibrada; es un punto a favor frente a potenciales inversionistas o bancos.`);

  if (maxVar) recomendaciones.push(`Dado que "${maxVar}" es la variable más sensible, prioriza contratos, negociaciones o controles internos que reduzcan su volatilidad.`);

  recomendaciones.push(isFinite(M.payback.economico) && M.payback.economico>3
    ? `Busca formas de acelerar la recuperación de la inversión: aumentar el precio de venta, reducir costos variables o incrementar la producción planificada.`
    : `El período de recuperación actual es razonable; documenta los supuestos clave para sustentarlo ante inversionistas.`);

  recomendaciones.push(`Revisa el Análisis de Sensibilidad periódicamente conforme cambien las condiciones del mercado (precio de insumos, tipo de cambio, demanda).`);

  recomendaciones.push(`Actualiza las variables del simulador con datos reales una vez iniciada la operación, para comparar lo proyectado contra lo efectivamente ejecutado.`);

  recomendaciones.push(`Considera un colchón adicional de capital de trabajo si el ciclo de cobro a clientes suele ser más largo que el de pago a proveedores.`);

  recomendaciones.push(`Antes de ejecutar el proyecto, valida los supuestos de Ke y WACC con datos actualizados de tasas de interés y riesgo país vigentes.`);

  return { conclusiones: conclusiones.slice(0,10), recomendaciones: recomendaciones.slice(0,10), viable };
}

function itemsTable(items, cols, prefix){
  const rows = items.map((it,idx)=>`<tr>${cols.map(c=>{
      if (c.type==='computed'){
        return `<td class="computed-cell">${c.compute(it)}</td>`;
      }
      if (c.type==='select') return `<td><select data-item="${prefix}" data-idx="${idx}" data-field="${c.key}">${c.options.map(o=>`<option value="${o}" ${it[c.key]===o?'selected':''}>${o}</option>`).join('')}</select></td>`;
      let val = it[c.key]!==undefined? it[c.key] : '';
      if (c.type==='number' && val!==''){ const n=Number(val); if (isFinite(n)) val = n.toFixed(2); }
      const minAttr = (c.minKey && it[c.minKey]) ? ` min="${it[c.minKey]}"` : '';
      return `<td><input type="${c.type}" step="any"${minAttr} data-item="${prefix}" data-idx="${idx}" data-field="${c.key}" value="${val}"></td>`;
    }).join('')}<td><button class="rm" data-rmitem="${prefix}" data-idx="${idx}">✕</button></td></tr>`).join('');
  return `<table class="item-table"><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table><button class="add-row" data-additem="${prefix}">+ Agregar fila</button>`;
}

function renderAdminLegacy(){
  if (!state.adminData){
    return `<div class="topbar"><div><div class="crumbs">Solo administradores</div><h1>Panel de Administrador</h1></div></div><div class="card">Cargando usuarios…</div>`;
  }
  if(state.adminData.loadError){
    return `<div class="topbar"><div><div class="crumbs">Solo administradores</div><h1>Panel de Administrador</h1></div></div><div class="card"><h3>No se pudo leer el registro compartido</h3><p>${state.adminData.loadError}</p><p>Verifica que hayas ejecutado el archivo SQL de configuración en Supabase y que la sesión sea la administradora.</p></div>`;
  }
  const { registry, admins, accounts } = state.adminData;
  const now=new Date(), sevenDaysAgo=new Date(now.getTime()-7*24*60*60*1000);
  const validRegistrationDates=registry.map(u=>({email:u.email,date:new Date(u.registeredAt)})).filter(u=>Number.isFinite(u.date.getTime()));
  const registrationsLast7Days=validRegistrationDates.filter(u=>u.date>=sevenDaysAgo&&u.date<=now).length;
  const registrationsToday=validRegistrationDates.filter(u=>u.date.getFullYear()===now.getFullYear()&&u.date.getMonth()===now.getMonth()&&u.date.getDate()===now.getDate()).length;
  const blockedCount=registry.filter(u=>!!((accounts&&accounts[u.email]||{}).blocked)).length;
  const pendingCount=registry.filter(u=>u.accessStatus==='pending').length;
  const reviewCount=registry.filter(u=>u.role!=='admin'&&u.accessStatus==='active'&&!u.accessSource).length;
  const adminCount=registry.filter(u=>admins.includes(u.email)).length;
  const adminMetrics=kpiRow([
    {label:'Cuentas registradas',value:registry.length},
    {label:'Pagos por revisar',value:reviewCount},
    {label:'Cuentas bloqueadas',value:blockedCount},
    {label:'Registros pendientes antiguos',value:pendingCount},
    {label:'Registros últimos 7 días',value:registrationsLast7Days}
  ]);
  const dailyCounts=Array.from({length:7},(_,offset)=>{
    const day=new Date(now); day.setHours(0,0,0,0); day.setDate(day.getDate()-(6-offset));
    const next=new Date(day); next.setDate(next.getDate()+1);
    return {label:day.toLocaleDateString('es-EC',{weekday:'short'}),date:day.toLocaleDateString('es-EC',{day:'2-digit',month:'short'}),count:validRegistrationDates.filter(u=>u.date>=day&&u.date<next).length};
  });
  const maxDaily=Math.max(1,...dailyCounts.map(d=>d.count));
  const memberRows=registry.filter(u=>!admins.includes(u.email));
  const statusCounts={active:memberRows.filter(u=>(accounts?.[u.email]?.accessStatus||u.accessStatus)==='active').length,pending:memberRows.filter(u=>(accounts?.[u.email]?.accessStatus||u.accessStatus)==='pending').length,blocked:memberRows.filter(u=>['blocked','revoked'].includes(accounts?.[u.email]?.accessStatus||u.accessStatus)).length};
  const statusTotal=Math.max(1,memberRows.length);
  const metricsChart=`<div class="grid grid-2" style="margin:12px 0 16px;align-items:stretch;"><section class="card" style="margin:0;"><h3 style="margin-top:0;">Registros · últimos 7 días</h3><div role="img" aria-label="Registros diarios de los últimos siete días" style="height:155px;display:flex;align-items:flex-end;gap:10px;padding:8px 4px 0;border-bottom:1px solid var(--border);">${dailyCounts.map(d=>`<div title="${d.date}: ${d.count} registros" style="height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;"><strong style="font-size:12px;">${d.count}</strong><div style="width:min(30px,80%);height:${Math.max(4,Math.round(d.count/maxDaily*100))}px;min-height:4px;background:var(--primary);border-radius:5px 5px 0 0;"></div><span style="font-size:10px;color:var(--text-dim);text-align:center;">${d.label}<br>${d.date}</span></div>`).join('')}</div><small class="sub">Total en el periodo: ${registrationsLast7Days}</small></section><section class="card" style="margin:0;"><h3 style="margin-top:0;">Estado de usuarios</h3><div role="img" aria-label="${statusCounts.active} activos, ${statusCounts.pending} pendientes y ${statusCounts.blocked} bloqueados" style="height:22px;display:flex;overflow:hidden;border-radius:12px;background:var(--secondary-dim);margin:22px 0 14px;">${statusCounts.active?`<span style="width:${statusCounts.active/statusTotal*100}%;background:var(--primary);"></span>`:''}${statusCounts.pending?`<span style="width:${statusCounts.pending/statusTotal*100}%;background:#c28b24;"></span>`:''}${statusCounts.blocked?`<span style="width:${statusCounts.blocked/statusTotal*100}%;background:#b9413b;"></span>`:''}</div><div style="display:grid;gap:10px;"><span>🟢 Activos <strong>${statusCounts.active}</strong></span><span>🟠 Pendientes <strong>${statusCounts.pending}</strong></span><span>🔴 Bloqueados o revocados <strong>${statusCounts.blocked}</strong></span><small class="sub">No incluye cuentas administradoras.</small></div></section></div>`;
  const rows = registry.map(u=>{
    const isAdm = admins.includes(u.email);
    const acc = (accounts && accounts[u.email]) || {};
    const status=acc.accessStatus||u.accessStatus||'pending';
    const paymentReview=status==='active'&&!isAdm&&!(acc.accessSource||u.accessSource);
    const isSelf = u.email===state.user;
    const fechaRegistro=new Date(u.registeredAt);
    const fechaHora=Number.isFinite(fechaRegistro.getTime())?fechaRegistro.toLocaleString('es-EC',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'No disponible';
    return `<tr>
      <td>${u.email}${isSelf?' <span class="badge info">Tú</span>':''}</td>
      <td>${fechaHora}</td>
      <td>${isAdm? '<span class="badge phase">Admin</span>' : ''} <span class="badge ${paymentReview?'info':(status==='active'?'success':(status==='pending'?'info':''))}" style="${status==='blocked'||status==='revoked'?'background:var(--secondary-dim);color:var(--secondary);':''}">${status==='active'?(paymentReview?'Activo · pago por revisar':'Activo'):status==='pending'?'Pendiente':status==='blocked'?'Bloqueado':'Revocado'}</span> <small>${acc.accessSource||u.accessSource||''}</small></td>
      <td style="white-space:nowrap;">
        ${isSelf||isAdm?'':`${paymentReview?`<button class="btn btn-sm btn-primary" data-payment-reviewed="${u.email}">Pago verificado</button> `:''}<button class="btn btn-sm ${status==='active'?'btn-danger':'btn-primary'}" data-access-toggle="${u.email}">${status==='active'?'Bloquear acceso':status==='blocked'?'Desbloquear acceso':status==='pending'?'Habilitar acceso':'Reactivar acceso'}</button> <button class="btn btn-sm btn-danger" data-user-delete="${u.id}" data-user-email="${u.email}">Eliminar</button>`}
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="topbar"><div><div class="crumbs">Solo administradores</div><h1>Panel de Administrador</h1><div class="sub">Revisa los pagos y bloquea cuentas que no correspondan con una compra.</div></div></div>
  ${adminMetrics}${metricsChart}<div class="sub" style="margin:0 0 14px 4px;">Nuevos registros hoy: <strong>${registrationsToday}</strong> · Se revisan cada 30 segundos mientras el simulador esté abierto con tu sesión de administrador. · Fechas según zona horaria de este navegador.</div>
  <div class="info-hint">Las cuentas nuevas pueden entrar de inmediato y aparecen como <strong>Pago por revisar</strong>. Comprueba la compra en Hotmart o tu medio de pago; marca el pago como verificado o bloquea la cuenta. También puedes activar avisos del navegador para recibir una notificación mientras el simulador esté abierto.</div>
  <div class="card"><button class="btn btn-sm btn-primary" id="btnEnableRegistrationNotifications">🔔 Activar notificaciones del navegador</button><span id="registrationNotificationStatus" class="sub" style="margin-left:10px;">${window.Notification?`Permiso: ${Notification.permission}`:'Este navegador no admite notificaciones.'}</span></div>
  <div class="info-hint">La contraseña es administrada por Supabase Auth. El botón de recuperación envía un enlace al correo del usuario; el administrador no puede ver contraseñas.</div>
  ${state.user===ADMIN_EMAIL&&state.isAdmin?`<div class="card"><h3>Limpiar datos del proyecto administrador</h3><p>Restablece las variables de <strong>${ADMIN_EMAIL}</strong> a cero y elimina los ítems de prueba. Conserva la cuenta, la contraseña y los usuarios registrados.</p><button class="btn btn-sm btn-danger" id="btnClearAdminProject">Limpiar mi proyecto de prueba</button></div>`:''}
  <div class="card">
    <h3>Usuarios Registrados (${registry.length})</h3>
    <div class="table-wrap"><table><thead><tr><th>Correo</th><th>Fecha y hora de registro</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Aún no hay usuarios registrados.</td></tr>'}</tbody></table></div>
  </div>`;
}

    </div>
    <div class="field-row">
      <div class="field"><label>Factor unitario de producción <span class="u">(valor fijo, no editable)</span></label><input type="number" value="${P.factorUnitario}" disabled></div>

    </div>
    <div class="field-row"><div class="field"><label>% de utilización de la capacidad instalada</label><input id="v-pctUtilizacion" type="number" step="any" value="${P.pctUtilizacion}"><span class="u">Ej: 0.5 = 50% de la capacidad máxima mensual</span></div></div>
    <h4 style="font-size:13px;margin:16px 0 8px;">📊 Cálculo automático de capacidad de producción</h4>

      ${calcBox('Unidades por Mes (por operario)', fmt(M.produccion.unidadesMesPorTrabajador,2), 'Unidades/día × días al mes')}
    </div>
    <div class="grid grid-2">
      ${calcBox('Producción Mensual Instalada (planta)', fmt(M.produccion.capacidadMensual,2), 'Unidades por mes (según tiempo de fabricación por unidad)')}
